<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>service-009</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#b0b0b0;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .title{position:absolute;left:128px;top:244px;font-size:25px;font-weight:700;line-height:36px;letter-spacing:.02em;color:#1a1a1a}
  .body{position:absolute;left:128px;top:339px;width:408px;font-size:16px;line-height:29px;color:#1a1a1a}

  /* 五角形の関係図 */
  .net{position:absolute;inset:0}
  .c{position:absolute;border-radius:50%;background:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center}
  .c b{font-size:13px;font-weight:700;letter-spacing:.06em;color:#8c8c8c}
  .c span{margin-top:6px;font-size:11px;font-weight:700;line-height:1.5;color:#1a1a1a}
  .hub{width:172px;height:172px}
  .hub b{font-size:14px}
  .hub span{margin-top:8px;font-size:15px}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="title">ダミーテキストダミーテキストダ<br>ダミーテキストダミーテキストダミ</div>
    <div class="body">ダミDU・ーテキストダミーテキストダミーテキスト、ダダミーテキスト「ダミーテキス」トダミーテキス。トダダミーテキストダミーテキストダミーテキストダミーテダミーテキストダミーテキストダ、 ミーテキストDU・ダダミーテキス、トダミーテキストダミー。</div>

    <svg class="net" viewBox="0 0 1280 720">
      <g stroke="rgba(255,255,255,.65)" stroke-width="3" fill="none">
        <line x1="667" y1="309" x2="877" y2="162"/>
        <line x1="877" y1="162" x2="1088" y2="309"/>
        <line x1="1088" y1="309" x2="1013" y2="565"/>
        <line x1="1013" y1="565" x2="741" y2="565"/>
        <line x1="741" y1="565" x2="667" y2="309"/>
      </g>
    </svg>

    <div class="c hub" style="left:794px;top:288px"><b>DU / MMYDUM</b><span>DU・ダミーテキ<br>ダミーテ</span></div>

    <div class="c" style="left:813px;top:99px;width:125px;height:125px"><b>MY</b><span>ダミーテキス<br>ダミーテキス</span></div>
    <div class="c" style="left:1024px;top:246px;width:125px;height:125px"><b>DUMMY</b><span>ダミーテ<br>ダミ</span></div>
    <div class="c" style="left:602px;top:246px;width:131px;height:125px"><b>DU</b><span>DUダミーテ</span></div>
    <div class="c" style="left:675px;top:502px;width:131px;height:125px"><b>MM</b><span>ダミーテ</span></div>
    <div class="c" style="left:947px;top:502px;width:131px;height:125px"><b>YDUMMYD</b><span>ダミーテキス</span></div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
