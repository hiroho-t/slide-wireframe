<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>service-004</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#efefef;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .side{position:absolute;left:0;top:0;width:44px;height:720px;background:#2b2b2b}
  .side-no{position:absolute;left:22px;top:27px;transform:translate(-50%,-50%);font-size:20px;font-weight:700;color:#fff}
  .side-rule{position:absolute;left:10px;top:44px;width:24px;height:1px;background:#fff}
  .side-ja{position:absolute;left:22px;top:60px;transform:translateX(-50%);writing-mode:vertical-rl;font-size:14px;letter-spacing:.3em;color:#fff}
  .side-logo{position:absolute;left:22px;top:619px;transform:translateX(-50%);writing-mode:vertical-rl;font-size:16px;font-weight:700;letter-spacing:.12em;color:#fff}

  .title{position:absolute;left:139px;top:127px;transform:translateY(-50%);font-size:32px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}

  .outer{position:absolute;left:281px;top:247px;width:775px;height:418px;border:2px solid #999;border-radius:16px;background:#d9d9d9}
  .cap{position:absolute;left:420px;top:229px;width:504px;height:41px;background:#fff;border:2px solid #666;border-radius:21px;
    display:grid;place-items:center;font-size:19px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .bar{position:absolute;left:333px;top:302px;width:674px;height:86px;background:#6b6b6b;
    display:grid;place-items:center;font-size:17px;font-weight:700;letter-spacing:.04em;color:#fff}

  .cn{position:absolute;background:#666}
  .pill{position:absolute;top:444px;height:27px;background:#fff;border:1px solid #666;border-radius:14px;
    display:grid;place-items:center;font-size:11px;color:#1a1a1a}
  .bx{position:absolute;top:494px;width:210px;height:137px;background:#fff;border:1px solid #999;border-radius:6px}
  .bh{position:absolute;top:539px;width:210px;transform:translateY(-50%);text-align:center;font-size:14px;font-weight:700;color:#1a1a1a}
  .bd{position:absolute;top:566px;width:210px;text-align:center;font-size:11px;line-height:22px;color:#1a1a1a}

  .copy{position:absolute;right:13px;top:686px;transform:translateY(-50%);font-size:12px;letter-spacing:.04em;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">

    <div class="bar">ダミーテキストダミー</div>

    <i class="cn" style="left:669px;top:388px;width:2px;height:32px"></i>

    <i class="cn" style="left:897px;top:471px;width:2px;height:23px"></i>

    <div class="pill" style="left:397px;width:86px">ダミーテ</div>
    <div class="pill" style="left:621px;width:98px">ダミーテキ</div>
    <div class="pill" style="left:831px;width:136px">ダミーテキストDU</div>

    <div class="bx" style="left:333px"></div>

    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
