<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>service-002</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .panel{position:absolute;left:0;top:0;width:639px;height:720px;background:#f7f8fa}
  .photo{position:absolute;left:639px;top:0;width:641px;height:720px;background:#c9cdd2;
    display:grid;place-items:center;font-size:16px;letter-spacing:.2em;color:#8c8c8c}

  .no{position:absolute;left:41px;top:32px;transform:translateY(-50%);font-size:14px;color:#4d4d4d}
  .h-ja{position:absolute;left:78px;top:32px;transform:translateY(-50%);font-size:17px;font-weight:700;color:#1a1a1a}
  .h-en{position:absolute;left:221px;top:32px;transform:translateY(-50%);font-size:14px;color:#1a1a1a}

  .tag{position:absolute;left:39px;top:102px;transform:translateY(-50%);font-size:11px;color:#6b6b6b}
  .big{position:absolute;left:39px;top:162px;transform:translateY(-50%);font-size:33px;font-weight:700;letter-spacing:.01em;color:#1a1a1a}
  .sub{position:absolute;left:39px;top:201px;transform:translateY(-50%);font-size:15px;font-weight:700;color:#1a1a1a}
  .lead{position:absolute;left:39px;top:231px;width:452px;font-size:12px;line-height:19px;color:#333}

  .card{position:absolute;left:39px;width:554px;background:#fff}
  .ch{position:absolute;left:63px;transform:translateY(-50%);font-size:15px;font-weight:700;color:#1a1a1a}
  .li{position:absolute;font-size:11px;line-height:21.5px;color:#1a1a1a}
  .li div{position:relative;padding-left:16px}
  .li div:before{content:"";position:absolute;left:2px;top:8px;width:4px;height:4px;border-radius:50%;background:#4d4d4d}
  .ck{position:absolute;left:64px;font-size:11px;line-height:25px;color:#1a1a1a}
  .ck div{position:relative;padding-left:23px}
  .ck div:before{content:"";position:absolute;left:0;top:6px;width:13px;height:13px;border:1px solid #8c8c8c;border-radius:2px}

  .logo{position:absolute;left:41px;top:692px;transform:translateY(-50%);font-size:18px;font-weight:700;letter-spacing:.06em;color:#1a1a1a}
  .copy{position:absolute;right:28px;top:700px;transform:translateY(-50%);font-size:12px;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="panel"></div>
    <div class="photo">IMAGE</div>

    <div class="no">02</div>
    <div class="h-ja">ダミーテキス</div>
    <div class="h-en">Strategy Design</div>

    <div class="tag">Service 01</div>
    <div class="big">Strategy Design</div>
    <div class="sub">ダミーテキストダミ「ーテキストダ」ミーテキス</div>
    <div class="lead">ダミ・ーテキス・トダミーテキストダミーテキストダミ。<br>ダミーテキストダミーテキストダミーテキスト、ダミーテキスト・ダミーテキストダミー。</div>

    <div class="card" style="top:297px;height:136px"></div>
    <div class="ch" style="top:325px">ダミーテキス</div>
    <div class="li" style="left:78px;top:350px">
      <div>ダミーテキストダ</div>
      <div>DUダミーテ</div>
      <div>ダミーテキストダ</div>
    </div>
    <div class="li" style="left:334px;top:350px">
      <div>ダミーテキスト</div>
      <div>ダミーテキストダ</div>
    </div>

    <div class="card" style="top:459px;height:167px"></div>
    <div class="ch" style="top:489px">ダミーテキストダ</div>
    <div class="ck" style="top:512px">
      <div>ダミーテキストダミーテキストダミ</div>
      <div>ダミーテキストダミーテキストダミー</div>
      <div>ダミーテキストダミーテキストダミーテキス</div>
      <div>ダミーテキストダミーテキス</div>
    </div>

    <div class="logo">LOGO</div>
    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
