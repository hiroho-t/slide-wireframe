<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clients-003</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fcfcfd;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .no{position:absolute;left:41px;top:33px;transform:translateY(-50%);font-size:14px;color:#4d4d4d}
  .h-ja{position:absolute;left:78px;top:33px;transform:translateY(-50%);font-size:16px;font-weight:700;color:#1a1a1a}
  .h-en{position:absolute;left:180px;top:33px;transform:translateY(-50%);font-size:12px;color:#8c8c8c}

  /* 実績バンド */
  .band{position:absolute;left:103px;top:119px;width:1077px;height:136px;background:#4d4d4d}
  .band-txt{position:absolute;left:148px;top:210px;transform:translateY(-50%);font-size:15px;color:#fff}
  .stat{position:absolute;left:686px;top:185px;transform:translateY(-50%);display:flex;align-items:baseline;gap:22px;color:#fff}
  .stat b{font-size:68px;font-weight:700;line-height:1;letter-spacing:-.01em}
  .stat span{font-size:28px}
  .stat sup{font-size:22px;vertical-align:super}
  .stat i{width:1px;height:67px;background:rgba(255,255,255,.5);align-self:center;font-style:normal}

  /* ロゴグリッド */
  .grid{position:absolute;left:148px;top:330px;width:975px;display:grid;grid-template-columns:repeat(5,1fr);gap:37px 40px}
  .grid i{height:46px;background:#ededed;border:1px solid #e0e0e0;
    display:grid;place-items:center;font-size:10px;font-style:normal;letter-spacing:.12em;color:#8c8c8c}

  .logo{position:absolute;left:41px;top:694px;transform:translateY(-50%);font-size:18px;font-weight:700;letter-spacing:.06em;color:#1a1a1a}
  .copy{position:absolute;right:39px;top:699px;transform:translateY(-50%);font-size:11px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="no">02</div>
    <div class="h-ja">ダミーテ</div>
    <div class="h-en">Ddummydu</div>

    <div class="band"></div>
    <div class="band-txt">0000ダ0ミーテキストダミーテ、0キス000トダミーテキ</div>
    <div class="stat">
      <b>0</b><span>years</span><i></i><b>000<sup>+</sup></b><span>projects</span>
    </div>

    <div class="grid">
      <i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i>
      <i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i>
      <i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i>
    </div>

    <div class="logo">LOGO</div>
    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
