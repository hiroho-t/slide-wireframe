<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clients-007</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#f5f5f5;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .title{position:absolute;left:53px;top:61px;transform:translateY(-50%);font-size:33px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .logo{position:absolute;right:46px;top:61px;transform:translateY(-50%);font-size:26px;font-weight:700;letter-spacing:.04em;color:#1a1a1a}

  .stlb{position:absolute;left:96px;width:270px;top:165px;transform:translateY(-50%);text-align:center;font-size:14px;color:#4d4d4d}
  .stnm{position:absolute;left:96px;width:270px;top:204px;transform:translateY(-50%);text-align:center;font-size:32px;font-weight:700;color:#1a1a1a}
  .stnm span{font-size:20px}

  .pl{position:absolute;transform:translate(-50%,-50%);top:186px;font-size:20px;font-weight:700;letter-spacing:.02em;color:#1a1a1a;white-space:nowrap}
  .ph{position:absolute;transform:translate(-50%,-50%);top:217px;font-size:12px;color:#4d4d4d;white-space:nowrap}

  .card{position:absolute;width:199px;height:57px;background:#fff;border:1px solid #e6e6e6;
    display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.14em;color:#8c8c8c}

  .copy{position:absolute;left:23px;top:698px;transform:translateY(-50%);font-size:12px;color:#8c8c8c}
  .num{position:absolute;right:38px;top:698px;transform:translateY(-50%);font-size:12px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">

    <div class="card" style="left:92px;top:348px">LOGO</div><div class="card" style="left:315px;top:348px">LOGO</div><div class="card" style="left:539px;top:348px">LOGO</div><div class="card" style="left:762px;top:348px">LOGO</div><div class="card" style="left:985px;top:348px">LOGO</div>
    <div class="card" style="left:92px;top:430px">LOGO</div><div class="card" style="left:315px;top:430px">LOGO</div><div class="card" style="left:539px;top:430px">LOGO</div><div class="card" style="left:762px;top:430px">LOGO</div><div class="card" style="left:985px;top:430px">LOGO</div>
    <div class="card" style="left:92px;top:512px">LOGO</div><div class="card" style="left:315px;top:512px">LOGO</div><div class="card" style="left:539px;top:512px">LOGO</div><div class="card" style="left:762px;top:512px">LOGO</div><div class="card" style="left:985px;top:512px">LOGO</div>
    <div class="card" style="left:92px;top:593px">LOGO</div><div class="card" style="left:315px;top:593px">LOGO</div><div class="card" style="left:539px;top:593px">LOGO</div><div class="card" style="left:762px;top:593px">LOGO</div><div class="card" style="left:985px;top:593px">LOGO</div>

  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
