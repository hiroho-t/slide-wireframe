<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clients-004</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#ededed;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  /* 左の縦帯 */
  .side{position:absolute;left:0;top:0;width:46px;height:720px;background:#2b2b2b}
  .side-no{position:absolute;left:18px;top:30px;transform:translateY(-50%);font-size:22px;font-weight:700;color:#fff}
  .side-rule{position:absolute;left:7px;top:50px;width:25px;height:1px;background:#fff}
  .side-ja{position:absolute;left:23px;top:75px;transform:translateX(-50%);writing-mode:vertical-rl;font-size:15px;letter-spacing:.3em;color:#fff}
  .side-logo{position:absolute;left:23px;top:619px;transform:translateX(-50%);writing-mode:vertical-rl;font-size:16px;font-weight:700;letter-spacing:.12em;color:#fff}

  .title{position:absolute;left:87px;top:60px;transform:translateY(-50%);font-size:28px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}

  .card{position:absolute;left:108px;top:110px;width:1129px;height:548px;background:#fff;border-radius:21px}

  .grid{position:absolute;left:165px;top:176px;width:1010px;display:grid;grid-template-columns:repeat(4,1fr);gap:75px 70px}
  .grid i{height:50px;background:#ededed;border:1px solid #e0e0e0;
    display:grid;place-items:center;font-size:11px;font-style:normal;letter-spacing:.12em;color:#8c8c8c}

  .copy{position:absolute;right:43px;top:700px;transform:translateY(-50%);font-size:11px;letter-spacing:.04em;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="side"></div>
    <div class="side-no">2</div>
    <div class="side-rule"></div>
    <div class="side-ja">ダミーテ</div>
    <div class="side-logo">LOGO</div>

    <div class="title">ダミーテ</div>
    <div class="card"></div>

    <div class="grid">
      <i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i>
      <i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i>
      <i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i>
      <i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i>
    </div>

    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
