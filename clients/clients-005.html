<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clients-005</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  /* 左の縦書き見出し */
  .title{position:absolute;left:66px;top:46px;transform:translateX(-50%);writing-mode:vertical-rl;
    font-size:20px;font-weight:700;color:#1a1a1a}

  .grid{position:absolute;left:136px;top:188px;width:1036px;display:grid;grid-template-columns:repeat(5,1fr);gap:56px 34px}
  .grid i{height:44px;background:#ededed;border:1px solid #e0e0e0;
    display:grid;place-items:center;font-size:10px;font-style:normal;color:#8c8c8c}

  .page{position:absolute;right:39px;top:690px;transform:translateY(-50%);font-size:11px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="title">Clients</div>

    <div class="grid">
      <i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i>
      <i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i>
      <i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i>
      <i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i><i>LOGO</i>
    </div>

    <div class="page">7</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
