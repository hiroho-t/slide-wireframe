<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>message-004</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  /* 左上：ロゴ＋区切り線＋ページ見出し */
  .brand{position:absolute;left:32px;top:37px;transform:translateY(-50%);font-size:25px;line-height:1;font-weight:700;color:#1a1a1a}
  .vr{position:absolute;left:134px;top:37px;transform:translateY(-50%);width:1px;height:32px;background:#d0d0d0}
  .head{position:absolute;left:151px;top:37px;transform:translateY(-50%);font-size:17px;line-height:1;color:#1a1a1a}

  /* 左：写真 */
  .photo{position:absolute;left:118px;top:164px;width:404px;height:392px;background:#d0d0d0;border-radius:28px;display:grid;place-items:center;font-size:16px;letter-spacing:.2em;color:#8c8c8c}

  /* 右：本文 */
  .eyebrow{position:absolute;left:617px;top:202px;transform:translateY(-50%);font-size:14px;line-height:1;font-weight:700;color:#1a1a1a}
  .lead{position:absolute;left:617px;top:230px;width:560px;font-size:27px;line-height:1.31;font-weight:700;color:#1a1a1a}
  .body{position:absolute;left:617px;top:326px;width:560px;font-size:14px;line-height:1.52;color:#1a1a1a}
  .body p + p{margin-top:14px}

  /* 署名（右揃え） */
  .sign{position:absolute;right:165px;top:492px;text-align:right;font-size:14px;line-height:1.52;color:#1a1a1a}

  .page{position:absolute;right:47px;top:684px;transform:translateY(-50%);font-size:13px;color:#8c8c8c}
  .bar::before{content:"";position:absolute;left:0;top:0;width:48px;height:4px;background:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="brand">LOGO</div>
    <div class="vr"></div>
    <div class="head">ダミー項目の名称</div>

    <div class="photo">IMAGE</div>

    <div class="eyebrow">ダミー項目名</div>
    <div class="lead">ダミーテキストで、<br>ダミーに関わる名称の未来を変える</div>

    <div class="body">
      <p>私たちダミー・ダミーテキストは、ダミーとダミーテキストの力でダミーテキストを根本から変えるという、世界に前例のない挑戦をしています。困難な道のりですが、その先には必ずダミーテキストをより良くする未来があります。</p>
      <p>ダミーテキストを社会に実装し、世界を動かすダミーを生み出すのは私たち自身。最先端のダミーテキストを武器に仲間と切磋琢磨しながら、この壮大な挑戦を共に楽しみ、未来を創っていきませんか？</p>
    </div>

    <div class="sign">項目名称<br>ダミー 名</div>

    <div class="page">00</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
