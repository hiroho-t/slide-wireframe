<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mission-008</title>
<style>

  .logo{position:absolute;left:150px;top:355px;transform:translateY(-50%);font-size:64px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}

  .lb{position:absolute;left:640px;top:152px;transform:translateY(-50%);font-size:24px;font-weight:700;letter-spacing:.04em;color:#1a1a1a}
  .ttl{position:absolute;left:640px;transform:translateY(-50%);font-size:38px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .bd{position:absolute;left:640px;top:430px;font-size:13px;line-height:29px;letter-spacing:.02em;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">

    <div class="lb">Mission</div>

  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
