  .ttl{position:absolute;left:590px;top:162px;transform:translateY(-50%);font-size:40px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}

  .l2{position:absolute;left:590px;top:275px;transform:translateY(-50%);font-size:12px;font-weight:700;letter-spacing:.08em;color:#1a1a1a}
  .bd{position:absolute;left:590px;top:298px;font-size:15px;line-height:44px;letter-spacing:.02em;color:#1a1a1a}

  .fc{position:absolute;right:38px;top:697px;transform:translateY(-50%);font-size:8px;letter-spacing:.02em;color:#8c8c8c}

</head>
<body>

<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
