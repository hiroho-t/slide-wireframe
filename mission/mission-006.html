<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mission-006</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#f7f8f9;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);font-feature-settings:"palt" 1}

  .vr{position:absolute;left:30px;top:20px;width:1px;height:36px;background:#8c8c8c}
  .vl{position:absolute;left:24px;top:34px;font-size:10px;letter-spacing:.14em;color:#4d4d4d;writing-mode:vertical-rl}

  .card{position:absolute;left:92px;top:98px;width:1096px;height:516px;background:#fff;border-radius:14px}

  .en{position:absolute;left:0;top:240px;width:1280px;text-align:center;transform:translateY(-50%);
    font-size:22px;font-weight:700;letter-spacing:.06em;color:#1a1a1a}
  .en i{display:inline-block;width:1px;height:16px;background:#c4c4c4;margin:0 14px;vertical-align:-2px}
  .en em{font-style:normal;font-size:13px;font-weight:700;letter-spacing:.04em}
  .ttl{position:absolute;left:0;width:1280px;text-align:center;transform:translateY(-50%);
    font-size:38px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}

  .pn{position:absolute;left:24px;top:686px;font-size:11px;letter-spacing:.02em;color:#4d4d4d}
  .pn em{font-style:normal;font-size:9px}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="vr"></div>
    <div class="vl">ダミーテキストダ</div>

    <div class="card"></div>
    <div class="en">PURPOSE<i></i><em>ダミーテキ</em></div>
    <div class="ttl" style="top:318px">“ダミーテキストダ”ダミーテキストダミ、</div>
    <div class="ttl" style="top:390px">ダミーテキ「ダミーテ！」ダミーテキ。</div>
    <div class="ttl" style="top:462px">ダミーテキストダミーテキストダミーテ。</div>

    <div class="pn">0<em>/00</em></div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
