<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mission-007</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);font-feature-settings:"palt" 1;
    background:radial-gradient(70% 80% at 30% 60%,#7d7d7d 0%,#6b6b6b 45%,#8c8c8c 100%)}

  .logo{position:absolute;left:30px;top:52px;transform:translateY(-50%);font-size:21px;font-weight:700;letter-spacing:.06em;color:#fff}
  .lb{position:absolute;left:126px;top:255px;transform:translateY(-50%);font-size:19px;letter-spacing:.04em;color:#e6e6e6}
  .ttl{position:absolute;left:126px;transform:translateY(-50%);font-size:34px;font-weight:700;letter-spacing:.02em;color:#fff}
  .bd{position:absolute;left:628px;font-size:15px;line-height:31px;letter-spacing:.02em;color:#fff}

  .fl{position:absolute;left:30px;top:690px;transform:translateY(-50%);font-size:11px;letter-spacing:.04em;color:#fff}
  .fc{position:absolute;right:30px;top:690px;transform:translateY(-50%);font-size:11px;letter-spacing:.02em;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="logo">LOGO</div>

    <div class="lb">Mission</div>
    <div class="ttl" style="top:325px">ダミーテキストダミーテ、</div>
    <div class="ttl" style="top:390px">ダミーテキストダ。</div>

    <div class="bd" style="top:250px">ダミーテキストダミーテキストダ。<br>ダミーテキストダミーテキ、ダミーテキストダミーテキストダミーテ、<br>ダミーテキストダミーテキストダミーテキストダ。</div>
    <div class="bd" style="top:400px">ダミーテキストダミーテキストダミーテキストダ、<br>ダミーテキストダミーテキストダミ。<br>ダミーテキストダミーテキストダミーテキストダ、<br>ダミーテキストダミーテキ。</div>

    <div class="fl">0　|　Mission</div>
    <div class="fc">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
