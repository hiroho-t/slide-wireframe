<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mission-011</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);font-feature-settings:"palt" 1}

  .hl{position:absolute;left:35px;top:64px;transform:translateY(-50%);font-size:28px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .logo{position:absolute;right:35px;top:48px;transform:translateY(-50%);font-size:17px;font-weight:700;letter-spacing:.04em;color:#1a1a1a}

  .ttl{position:absolute;left:72px;transform:translateY(-50%);font-size:62px;font-weight:700;letter-spacing:.01em;color:#1a1a1a}
  .bd{position:absolute;left:72px;font-size:15px;font-weight:700;line-height:31px;letter-spacing:.02em;color:#1a1a1a}
  .pn{position:absolute;right:38px;top:672px;transform:translateY(-50%);font-size:11px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="hl">MISSION</div>
    <div class="logo">LOGO</div>

    <div class="ttl" style="top:243px">ダミーテキ、ダミーテ。</div>
    <div class="ttl" style="top:337px">ダミーテキストダミ、ダミーテ。</div>

    <div class="bd" style="top:430px">ダミーテキストダ、Dummydumダミーテキストダミーテキストダミ「ダミーテキ」ダミーテキ、<br>ダミーテキストダミーテキストダミーテキストダミーテ。</div>
    <div class="bd" style="top:513px">ダミーテキストダミーテキストダミーテキストダミーテキ、<br>ダミーテキストダミーテキストダ、ダミーテキストダミーテキストダミーテキストダ。</div>

    <div class="pn">00</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
