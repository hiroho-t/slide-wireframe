<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mission-012</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#5c5c5c;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);font-feature-settings:"palt" 1}
  .ph{position:absolute;right:24px;top:20px;font-size:12px;letter-spacing:.2em;color:#d5d5d5}

  .cap{position:absolute;left:118px;top:105px;transform:translateY(-50%);font-size:29px;font-weight:700;letter-spacing:.04em;color:#d5d5d5}
  .lb{position:absolute;left:118px;transform:translateY(-50%);font-size:20px;font-weight:700;letter-spacing:.04em;color:#fff}
  .lb em{font-style:normal;font-size:13px;font-weight:400;letter-spacing:.02em;margin-left:12px}
  .ttl{position:absolute;left:118px;transform:translateY(-50%);font-size:46px;font-weight:700;letter-spacing:.06em;color:#fff}
  .bd{position:absolute;left:118px;font-size:14px;line-height:39px;letter-spacing:.02em;color:#fff}

  .fg{position:absolute;left:48px;top:686px;transform:translateY(-50%);font-size:16px;font-weight:700;letter-spacing:.06em;color:#fff}
  .pn{position:absolute;right:32px;top:686px;transform:translateY(-50%);font-size:11px;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <span class="ph">IMAGE</span>

    <div class="cap">ダミーテキDUダミーテキストダ「ダミーテキDUダミーテキ」</div>
    <div class="lb" style="top:174px">MISSION<em>− ダミーテキストダ −</em></div>
    <div class="ttl" style="top:245px">ダミーテ、ダミーテ。</div>
    <div class="bd" style="top:302px">ダミーテキ、ダミーテキストダミーテキストダミ、ダミーテキストダミーテキストダミーテキ。</div>

    <div class="lb" style="top:390px">VISION<em>− ダミーテキストダミーテ −</em></div>
    <div class="ttl" style="top:462px">ダミーテキストダ</div>
    <div class="bd" style="top:518px">ダミーテキストダミーテキストダ、ダミーテキストダミーテキストダ。<br>ダミーテキストダミーテキストダミーテキストダ、ダミーテキストダ「ダミーテキストダ」ダミ、<br>ダミーテキストダミーテキストダミーテ、ダミーテキストダミーテキストダミーテキストダ。</div>

    <div class="fg">LOGO</div>
    <div class="pn">00</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
