<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mission-014</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);font-feature-settings:"palt" 1;
    background:linear-gradient(160deg,#e8e8e8 0%,#dcdcdc 45%,#cfcfcf 100%);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif}

  .lb{position:absolute;left:38px;top:52px;transform:translateY(-50%);font-size:24px;letter-spacing:.04em;color:#1a1a1a}
  .card{position:absolute;left:138px;top:135px;width:1006px;height:452px;background:#fff;border-radius:16px}

  .ttl{position:absolute;left:138px;top:282px;width:1006px;text-align:center;transform:translateY(-50%);
    font-size:32px;letter-spacing:.06em;color:#1a1a1a}
  .bd{position:absolute;left:138px;top:340px;width:1006px;text-align:center;
    font-size:13px;line-height:29px;letter-spacing:.06em;color:#1a1a1a}

  .fr{position:absolute;right:80px;top:673px;width:110px;height:1px;background:#8c8c8c}
  .fc{position:absolute;right:36px;top:673px;transform:translateY(-50%);font-size:10px;letter-spacing:.06em;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="lb">Purpose</div>
    <div class="card"></div>

    <div class="ttl">ダミーテキストダミ　ダミーテキストダミーテ</div>
    <div class="bd">ダミーテキストダミーテキ、ダミーテ。<br>ダミーテキストダミーテキストダ。<br>ダミーテキストダ、ダミーテキストダミーテキ。<br>ダミーテキストダミーテキストダ、ダミーテキストダミーテキストダ。</div>

    <div class="fr"></div>
    <div class="fc">DUM DUMMY CULTURE DECK　0</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
