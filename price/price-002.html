<title>price-002</title>
<style>

  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .no{position:absolute;left:21px;top:72px;transform:translateY(-50%);font-size:22px;font-weight:700;letter-spacing:.06em;color:#1a1a1a}

  .brand{position:absolute;right:41px;top:44px;transform:translateY(-50%);font-size:12px;font-weight:700;letter-spacing:.12em;color:#8c8c8c}
  .title{position:absolute;left:135px;top:104px;transform:translateY(-50%);font-size:46px;font-weight:700;letter-spacing:.1em;color:#1a1a1a}

  /* プラン見出し */
  .ph{position:absolute;top:150px;height:56px;border-radius:8px 8px 0 0;display:grid;place-items:center;
    font-size:24px;font-weight:700;letter-spacing:.12em;color:#fff}
  .p1{left:347px;width:399px;background:#7a7a7a}
  .p2{left:750px;width:240px;background:#a8a8a8}

  /* 表 */

  .lb{position:absolute;left:103px;width:241px;transform:translateY(-50%);text-align:center;font-size:15px;font-weight:700;color:#1a1a1a}
  .vl{position:absolute;left:347px;width:399px;transform:translateY(-50%);text-align:center;font-size:16px;font-weight:700;color:#1a1a1a}
  .head-row{position:absolute;left:103px;top:206px;width:643px;height:88px}
  .price{position:absolute;left:347px;width:399px;top:254px;transform:translateY(-50%);text-align:center;font-size:29px;font-weight:700;color:#6b6b6b}
  .col2{position:absolute;left:750px;top:206px;width:240px;height:485px;border:1px solid #e0e0e0;border-top:0}
  .col2-t{position:absolute;left:750px;width:240px;top:443px;transform:translateY(-50%);text-align:center;font-size:21px;font-weight:700;color:#1a1a1a}

  /* オプションカード */
  .opt{position:absolute;left:1011px;top:150px;width:253px;height:541px;background:#ededed;border-radius:12px}
  .pill{position:absolute;left:1052px;top:241px;width:171px;height:45px;background:#6b6b6b;border-radius:23px;
    display:grid;place-items:center;font-size:19px;font-weight:700;letter-spacing:.1em;color:#fff}
  .oc{position:absolute;left:1011px;width:253px;transform:translateY(-50%);text-align:center;color:#1a1a1a}
  .oh{font-size:19px;font-weight:700;letter-spacing:.02em}
  .op{font-size:12px}
