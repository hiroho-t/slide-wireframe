<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toc-011</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .en{position:absolute;left:78px;top:65px;transform:translateY(-50%);font-size:15px;font-weight:700;color:#4d4d4d}
  .ja{position:absolute;left:74px;top:110px;transform:translateY(-50%);font-size:40px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .rule{position:absolute;left:78px;top:167px;width:32px;height:5px;background:#b3b3b3}

  .no{position:absolute;transform:translateY(-50%);font-size:11px;font-weight:700;color:#4d4d4d}
  .lb{position:absolute;transform:translateY(-50%);font-size:11px;font-weight:700;color:#4d4d4d}
  .ttl{position:absolute;transform:translateY(-50%);font-size:21px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="en">Index</div>
    <div class="ja">目次</div>
    <div class="rule"></div>

    <div class="no" style="left:164px;top:255px">1.</div>
    <div class="lb" style="left:204px;top:255px">Mission</div>
    <div class="ttl" style="left:202px;top:292px">ダミーテキスト</div>

    <div class="no" style="left:164px;top:383px">2.</div>
    <div class="lb" style="left:204px;top:383px">Strategy</div>
    <div class="ttl" style="left:202px;top:421px">ダミーテキ・ストダミ</div>

    <div class="no" style="left:164px;top:512px">3.</div>
    <div class="lb" style="left:204px;top:512px">Product</div>
    <div class="ttl" style="left:202px;top:549px">ダミーテキス・トダミーテ</div>

    <div class="no" style="left:643px;top:255px">4.</div>
    <div class="lb" style="left:685px;top:255px">Culture</div>
    <div class="ttl" style="left:680px;top:292px">ダミーテキ・ストダミーテキス</div>

    <div class="no" style="left:643px;top:383px">5.</div>
    <div class="lb" style="left:685px;top:383px">Recruit</div>
    <div class="ttl" style="left:680px;top:421px">ダミーテキス</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
