<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toc-003</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}


  /* 左：見出し */
  .en{position:absolute;left:145px;top:304px;transform:translateY(-50%);font-size:52px;font-weight:700;color:#333}
  .ja{position:absolute;left:147px;top:363px;transform:translateY(-50%);font-size:19px;font-weight:700;letter-spacing:.24em;color:#333}


  /* 右：白カード */
  .card{position:absolute;left:457px;top:20px;width:780px;height:670px;background:#fff;border-radius:20px;box-shadow:0 6px 28px rgba(0,0,0,.10)}

  /* 目次リスト */
  .item{position:absolute;left:614px;transform:translateY(-50%);font-size:21px;font-weight:700;color:#333;white-space:nowrap}
  .pg{position:absolute;right:183px;transform:translateY(-50%);font-size:19px;font-weight:700;color:#333}
  .dot{position:absolute;right:233px;height:1px;border-top:1px dotted #999}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="en">Index</div>
    <div class="ja">目次</div>


    <div class="card"></div>

    <div class="item" style="top:209px">ダミーテキスト名称</div>
    <div class="dot" style="left:837px;top:232px"></div>
    <div class="pg" style="top:209px">3</div>

    <div class="item" style="top:278px">ダミー名・項目名称</div>
    <div class="dot" style="left:837px;top:301px"></div>
    <div class="pg" style="top:278px">7</div>

    <div class="item" style="top:348px">ダミーテキストの項目名</div>
    <div class="dot" style="left:879px;top:371px"></div>
    <div class="pg" style="top:348px">30</div>

    <div class="item" style="top:418px">ダミーテキスト名</div>
    <div class="dot" style="left:816px;top:441px"></div>
    <div class="pg" style="top:418px">32</div>

    <div class="item" style="top:489px">項目</div>
    <div class="dot" style="left:690px;top:512px"></div>
    <div class="pg" style="top:489px">44</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
