<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toc-005</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  /* 左：ベタ面（上下左右の端はストレート） */
  .panel{position:absolute;left:0;top:0;width:343px;height:720px;background:#757575}
  .panel-en{position:absolute;left:45px;top:343px;transform:translateY(-50%);font-size:46px;line-height:1;font-weight:700;color:#fff}
  .panel-jp{position:absolute;left:45px;top:392px;transform:translateY(-50%);font-size:20px;line-height:1;color:#fff}

  /* 右：目次リスト（項目数に応じて積む） */
  .list{position:absolute;left:443px;top:129px;width:731px;display:flex;flex-direction:column;gap:40px}
  .row{display:flex;align-items:center;height:38px}
  .no{width:74px;flex:none;font-size:40px;line-height:1;font-weight:700;color:#757575}
  .bar{width:3px;height:38px;flex:none;background:#1a1a1a}
  .ttl{margin-left:22px;font-size:39px;line-height:1;font-weight:700;color:#1a1a1a;white-space:nowrap}
  .dots{flex:1;margin:0 18px;border-bottom:3px dotted #b3b3b3}
  .pg{width:54px;flex:none;text-align:right;font-size:20px;line-height:1;color:#1a1a1a}

  .page{position:absolute;right:15px;top:695px;transform:translateY(-50%);font-size:13px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="panel"></div>
    <div class="panel-en">CONTENTS</div>
    <div class="panel-jp">目次</div>

    <div class="list">
      <div class="row"><span class="no">01</span><i class="bar"></i><span class="ttl">項目名称</span><i class="dots"></i><span class="pg">P.0</span></div>
      <div class="row"><span class="no">02</span><i class="bar"></i><span class="ttl">ダミー項目</span><i class="dots"></i><span class="pg">P.0</span></div>
      <div class="row"><span class="no">03</span><i class="bar"></i><span class="ttl">項目と名称</span><i class="dots"></i><span class="pg">P.00</span></div>
      <div class="row"><span class="no">04</span><i class="bar"></i><span class="ttl">ダミーのカルチャー</span><i class="dots"></i><span class="pg">P.00</span></div>
      <div class="row"><span class="no">05</span><i class="bar"></i><span class="ttl">名称</span><i class="dots"></i><span class="pg">P.00</span></div>
      <div class="row"><span class="no">06</span><i class="bar"></i><span class="ttl">ダミー項目名（名称）</span><i class="dots"></i><span class="pg">P.00</span></div>
    </div>

    <div class="page">0</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
