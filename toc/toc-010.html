<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toc-010</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#333;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .head{position:absolute;left:107px;top:366px;transform:translateY(-50%);font-size:78px;font-weight:700;letter-spacing:.01em;color:#fff}
  .item{position:absolute;left:739px;transform:translateY(-50%);font-size:27px;font-weight:700;letter-spacing:.1em;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="head">Contents</div>

    <div class="item" style="top:183px">1. ダミーテ</div>
    <div class="item" style="top:274px">2. ダミーテ</div>
    <div class="item" style="top:364px">3. ダミーテ</div>
    <div class="item" style="top:455px">4. ダミーテ</div>
    <div class="item" style="top:544px">5. ダミーテキスト</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
