<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toc-006</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  /* 左上：ロゴ */
  .brand{position:absolute;left:31px;top:37px;transform:translateY(-50%);font-size:28px;line-height:1;font-weight:700;color:#1a1a1a}

  /* 角丸パネル（右端は画面外まで） */
  .panel{position:absolute;left:72px;top:137px;width:1290px;height:447px;background:#f2f2f2;border-radius:40px}

  .title{position:absolute;left:156px;top:263px;transform:translateY(-50%);font-size:27px;line-height:1;font-weight:700;color:#1a1a1a}

  /* 区切り線と2列の項目 */
  .vr{position:absolute;top:244px;width:1px;height:234px;background:#d0d0d0}
  .col{position:absolute;top:249px;display:flex;flex-direction:column;gap:37px;font-size:17px;line-height:1.42;color:#1a1a1a}

  .page{position:absolute;right:50px;top:684px;transform:translateY(-50%);font-size:13px;color:#8c8c8c}
  .bar{position:absolute;left:0;bottom:0;width:1280px;height:4px;background:#e0e0e0}
  .bar::before{content:"";position:absolute;left:0;top:0;width:60px;height:4px;background:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="brand">LOGO</div>

    <div class="panel"></div>
    <div class="title">目次</div>

    <div class="vr" style="left:517px"></div>
    <div class="vr" style="left:838px"></div>

    <div class="col" style="left:561px">
      <div>項目名称</div>
      <div>ダミーテキストを<br>取り巻く名称</div>
      <div>項目名</div>
      <div>ダミーの項目名</div>
    </div>

    <div class="col" style="left:882px">
      <div>ダミーが大切にしている名称</div>
      <div>項目と名称</div>
      <div>項目名</div>
      <div>ダミー項目の名称</div>
    </div>

    <div class="page">0</div>
    <div class="bar"></div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
