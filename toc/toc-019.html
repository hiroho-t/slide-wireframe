<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toc-019</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);font-feature-settings:"palt" 1}

  .hn{position:absolute;left:45px;top:46px;transform:translateY(-50%);font-size:19px;font-weight:700;color:#1a1a1a}
  .hl{position:absolute;left:93px;top:46px;transform:translateY(-50%);font-size:17px;font-weight:700;letter-spacing:.06em;color:#1a1a1a}

  .no{position:absolute;transform:translateY(-50%);font-size:62px;font-weight:700;font-style:italic;color:#8c8c8c}
  .it{position:absolute;left:180px;transform:translateY(-50%);font-size:30px;font-weight:700;letter-spacing:.06em;color:#1a1a1a}
  .ru{position:absolute;left:170px;width:646px;height:1px;background:#dcdcdc}

  .ph{position:absolute;left:885px;width:355px;background:#c4c4c4;
    display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#e6e6e6}

  .fg{position:absolute;left:45px;top:683px;transform:translateY(-50%);font-size:17px;font-weight:700;letter-spacing:.06em;color:#6b6b6b}
  .fc{position:absolute;right:58px;top:683px;transform:translateY(-50%);font-size:10px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="hn">00</div>
    <div class="hl">ダミーテキストダミーテキ</div>

    <div class="no" style="left:96px;top:242px">1</div>
    <div class="it" style="top:242px">ダミーテキストダミーテキストダ</div>
    <div class="ru" style="top:315px"></div>

    <div class="no" style="left:96px;top:385px">2</div>
    <div class="it" style="top:385px">ダミーテキストダミーテキストダミーテ</div>
    <div class="ru" style="top:458px"></div>

    <div class="no" style="left:96px;top:528px">3</div>
    <div class="it" style="top:528px">ダミーテキストダミーテ</div>

    <div class="ph" style="top:100px;height:196px">IMAGE</div>
    <div class="ph" style="top:302px;height:196px">IMAGE</div>
    <div class="ph" style="top:504px;height:152px">IMAGE</div>

    <div class="fg">LOGO</div>
    <div class="fc">© 20XX Company.　00</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
