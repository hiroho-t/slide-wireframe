<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toc-004</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  .head{position:absolute;left:34px;top:39px;transform:translateY(-50%);font-size:18px;font-weight:700;color:#333}
  .logo{position:absolute;right:40px;top:37px;transform:translateY(-50%);font-size:26px;font-weight:700;color:#1a1a1a}

  .num{position:absolute;left:171px;transform:translateY(-50%);font-size:18px;font-weight:700;color:#8c8c8c}
  .item{position:absolute;left:231px;transform:translateY(-50%);font-size:23px;font-weight:700;color:#1a1a1a}

  .copy{position:absolute;left:32px;top:690px;transform:translateY(-50%);font-size:11px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="head">目次</div>
    <div class="logo">LOGO</div>

    <div class="num" style="top:121px">01</div><div class="item" style="top:121px">項目名称</div>
    <div class="num" style="top:188px">02</div><div class="item" style="top:188px">ダミーテキスト項目名</div>
    <div class="num" style="top:257px">03</div><div class="item" style="top:257px">ダミー名</div>
    <div class="num" style="top:326px">04</div><div class="item" style="top:326px">ダミー名×AB</div>
    <div class="num" style="top:395px">05</div><div class="item" style="top:395px">ダミー項目</div>
    <div class="num" style="top:463px">06</div><div class="item" style="top:463px">項目名称</div>
    <div class="num" style="top:532px">07</div><div class="item" style="top:532px">ダミー名</div>
    <div class="num" style="top:601px">08</div><div class="item" style="top:601px">Dummy001</div>

    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
