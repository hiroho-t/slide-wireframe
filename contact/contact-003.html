<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contact-003</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  /* ヘッダー帯 */
  .bar{position:absolute;left:0;top:0;width:1280px;height:55px;background:#f2f2f2}
  .h-rule{position:absolute;left:39px;top:16px;width:2px;height:23px;background:#4d4d4d}
  .h-ja{position:absolute;left:74px;top:28px;transform:translateY(-50%);font-size:16px;font-weight:700;color:#1a1a1a}
  .logo{position:absolute;right:36px;top:27px;transform:translateY(-50%);font-size:26px;font-weight:700;color:#1a1a1a}

  /* 中央のブロック */
  .c{position:absolute;left:0;width:1280px;transform:translateY(-50%);text-align:center}
  .l1{top:327px;font-size:16px;font-weight:700;color:#1a1a1a}
  .l2{top:363px;font-size:17px;font-weight:700;color:#1a1a1a}
  .l3{top:398px;font-size:17px;color:#4d4d4d;text-decoration:underline;text-underline-offset:3px}

  .copy{position:absolute;left:0;width:1280px;top:702px;transform:translateY(-50%);text-align:center;font-size:12px;color:#c4c4c4}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="bar"></div>
    <div class="h-rule"></div>
    <div class="h-ja">ダミーテキス</div>
    <div class="logo">LOGO</div>

    <div class="c l1">ダミーテキスト</div>
    <div class="c l2">Dummy Dummydum Dummyd ダミー</div>
    <div class="c l3">dum@dummy.du</div>

    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
