<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contact-001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  .title{position:absolute;left:34px;top:64px;transform:translateY(-50%);font-size:28px;font-weight:700;color:#1a1a1a}

  .lead{position:absolute;left:105px;transform:translateY(-50%);font-size:20px;color:#1a1a1a}
  .url{position:absolute;left:463px;top:209px;transform:translateY(-50%);font-size:11px;color:#4d4d4d;text-decoration:underline;text-underline-offset:3px}

  .ph{position:absolute;top:287px;height:354px;background:#d0d0d0;
    display:grid;place-items:center;font-size:14px;letter-spacing:.2em;color:#8c8c8c}

  .copy{position:absolute;left:34px;top:689px;transform:translateY(-50%);font-size:11px;color:#8c8c8c}
  .page{position:absolute;right:32px;top:692px;transform:translateY(-50%);font-size:12px;color:#b3b3b3}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="title">ダミーテキストダミーテキストダミーテキストダ</div>

    <div class="lead" style="top:165px">ダミーテキストダミーテキストダミーテキストダミー《テキ0ストダ》</div>
    <div class="lead" style="top:209px">ダミーテキストダミーテキストダミ！</div>
    <div class="url">dummy://dum.mydummyd-u.mm.yd/ummydum/mydummyd/ummydummyd/</div>

    <div class="ph" style="left:95px;width:335px">IMAGE</div>
    <div class="ph" style="left:466px;width:345px">IMAGE</div>
    <div class="ph" style="left:839px;width:347px">IMAGE</div>

    <div class="copy">© 20XX Company.</div>
    <div class="page">26</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
