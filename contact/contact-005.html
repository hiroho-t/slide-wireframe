<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contact-005</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  .panel{position:absolute;left:0;top:0;width:730px;height:720px;background:#f7f8fa}

  .no{position:absolute;left:41px;top:32px;transform:translateY(-50%);font-size:14px;color:#4d4d4d}
  .h-ja{position:absolute;left:78px;top:32px;transform:translateY(-50%);font-size:17px;font-weight:700;color:#1a1a1a}
  .h-sub{position:absolute;left:242px;top:32px;transform:translateY(-50%);font-size:14px;color:#1a1a1a}

  .lead{position:absolute;left:222px;top:190px;transform:translateY(-50%);font-size:26px;font-weight:700;color:#1a1a1a}
  .lead em{font-style:normal;color:#4d4d4d}
  .qr-big{position:absolute;left:214px;top:243px;width:302px;height:305px;background:#fff;
    display:grid;place-items:center;font-size:14px;letter-spacing:.2em;color:#8c8c8c}

  .lb{position:absolute;left:890px;width:240px;transform:translateY(-50%);text-align:center;font-size:12px;font-weight:700;color:#1a1a1a}
  .qr{position:absolute;left:961px;width:100px;height:100px;background:#fff;border:1px solid #e0e0e0;
    display:grid;place-items:center;font-size:10px;color:#8c8c8c}

  .logo{position:absolute;left:41px;top:692px;transform:translateY(-50%);font-size:18px;font-weight:700;color:#1a1a1a}
  .copy{position:absolute;right:28px;top:700px;transform:translateY(-50%);font-size:12px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="panel"></div>

    <div class="no">05</div>
    <div class="h-ja">ダミーテキスト</div>
    <div class="h-sub">ダミーテキストダミーテキストダミ</div>

    <div class="lead"><em>ダミーテキス</em>トダミーテ</div>
    <div class="qr-big">QR</div>

    <div class="lb" style="top:100px">ダミーテキストダミ</div>
    <div class="qr" style="top:136px">QR</div>

    <div class="lb" style="top:289px">ダミーテキストダミ</div>
    <div class="qr" style="top:326px">QR</div>

    <div class="lb" style="top:478px">ダミーテキスト</div>
    <div class="qr" style="top:514px">QR</div>

    <div class="logo">LOGO</div>
    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
