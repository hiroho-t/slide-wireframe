<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contact-004</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);
    background:linear-gradient(125deg,#9e9e9e 0%,#b5b5b5 30%,#8a8a8a 60%,#a3a3a3 100%)}

  /* 断ち切りの大見出し */
  .big{position:absolute;left:-12px;top:-40px;font-size:200px;line-height:1;font-weight:700;letter-spacing:-.01em;color:rgba(255,255,255,.92)}

  .logo{position:absolute;right:16px;top:32px;transform:translateY(-50%);font-size:20px;font-weight:700;letter-spacing:.04em;color:#fff}

  .lead{position:absolute;left:117px;top:198px;font-size:24px;font-weight:700;line-height:39px;letter-spacing:.02em;color:#fff}

  /* QRカード4枚 */
  .card{position:absolute;top:315px;width:203px;height:202px;background:rgba(255,255,255,.28);border-radius:16px}
  .qr{position:absolute;top:333px;width:160px;height:165px;background:#fff;border:2px solid rgba(120,120,160,.5);
    display:grid;place-items:center;font-size:12px;letter-spacing:.1em;color:#8c8c8c}
  .lb{position:absolute;top:550px;transform:translateY(-50%);width:280px;text-align:center;font-size:14px;font-weight:700;letter-spacing:.02em;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="big">Join Us</div>
    <div class="logo">LOGO</div>

    <div class="lead">DUダミーテキストダミー、テキストダミーテキスト。<br>ダミーテキ、ストダミーテ。</div>

    <div class="card" style="left:117px"></div>
    <div class="qr" style="left:139px">QR</div>
    <div class="lb" style="left:78px">ダミーテキ</div>

    <div class="card" style="left:402px"></div>
    <div class="qr" style="left:424px">QR</div>
    <div class="lb" style="left:363px">Ddummyd Uumm（ダミーテ）</div>

    <div class="card" style="left:688px"></div>
    <div class="qr" style="left:710px">QR</div>
    <div class="lb" style="left:649px">ダミーテキストダミ</div>

    <div class="card" style="left:970px"></div>
    <div class="qr" style="left:992px">QR</div>
    <div class="lb" style="left:930px">Dd Uummydummダミーテキ</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
