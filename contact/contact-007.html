<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contact-007</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);font-feature-settings:"palt" 1}

  .hd{position:absolute;left:98px;top:167px;transform:translateY(-50%);font-size:22px;font-weight:700;letter-spacing:.14em;color:#1a1a1a}
  .bd{position:absolute;left:98px;top:190px;font-size:15px;line-height:31px;letter-spacing:.1em;color:#1a1a1a}

  .btn{position:absolute;left:648px;top:196px;width:230px;height:47px;border-radius:24px;background:#1a1a1a;
    display:flex;align-items:center;justify-content:center;gap:12px;
    font-size:15px;font-weight:700;letter-spacing:.04em;color:#fff}
  .btn i{width:22px;height:22px;border-radius:50%;background:#fff;flex:none}
  .url{position:absolute;left:658px;top:262px;transform:translateY(-50%);font-size:12px;letter-spacing:.02em;color:#1a1a1a;text-decoration:underline;text-underline-offset:3px}
  .qr{position:absolute;background:#d5d5d5;display:grid;place-items:center;font-size:10px;letter-spacing:.16em;color:#8c8c8c}

  .lg{position:absolute;transform:translateY(-50%);font-size:19px;font-weight:700;letter-spacing:.08em;color:#1a1a1a;text-align:center}
  .sn{position:absolute;top:360px;display:flex;gap:14px}
  .sn i{width:34px;height:34px;border-radius:8px;background:#d5d5d5}

  .fg{position:absolute;left:44px;top:690px;transform:translateY(-50%);font-size:15px;font-weight:700;letter-spacing:.06em;color:#6b6b6b}
  .fc{position:absolute;right:44px;top:690px;transform:translateY(-50%);font-size:10px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="hd">DUダミーテキストダ</div>
    <div class="bd">ダミーテキストダミーテキストダミーテキ、ダミーテキストダミーテ<br>ダミーテキストダミーテキストダミーテキストダミーテキ、<br>DUダミーテキストダミーテキストダミーテキストダミーテキストダ。<br>DUダミーテキストダミーテキストダミーテキ。</div>

    <div class="btn"><span>ダミーテキストダミーテ</span><i></i></div>
    <div class="url">https://www.dummytext.co.jp/inquiry.html</div>
    <div class="qr" style="left:1035px;top:172px;width:110px;height:110px">QR</div>

    <div class="lg" style="left:230px;top:355px;width:200px">LOGO</div>
    <div class="qr" style="left:280px;top:398px;width:100px;height:100px">QR</div>

    <div class="lg" style="left:540px;top:355px;width:200px">SERVICE LOGO</div>
    <div class="qr" style="left:590px;top:398px;width:100px;height:100px">QR</div>

    <div class="sn" style="left:855px"><i></i><i></i><i></i><i></i></div>
    <div class="qr" style="left:900px;top:398px;width:100px;height:100px">QR</div>

    <div class="fg">LOGO</div>
    <div class="fc">© 20XX Company.　00</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
