<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contact-006</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#2b2b2b;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .logo{position:absolute;left:0;width:1280px;top:321px;transform:translateY(-50%);text-align:center;font-size:85px;font-weight:700;letter-spacing:.02em;color:#fff}
  .sub{position:absolute;left:0;width:1280px;top:379px;transform:translateY(-50%);text-align:center;font-size:32px;font-weight:700;letter-spacing:.1em;color:#fff}

  .info{position:absolute;left:51px;top:597px;font-size:12px;line-height:22px;color:#fff}
  .info a{color:#fff;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="logo">LOGO</div>
    <div class="sub">ダミーテキ</div>

    <div class="info">
      ダミーテ：キストダミーテキ0-00–0<br>
      ダミーテ：キストダミーテキストダミ0−00<br>
      DUM：<a href="#">dummy://dummyd.um.my/</a><br>
      ダミーテキストダ：<a href="#">dummy://dummyd.um.my/dummydu</a>
    </div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
