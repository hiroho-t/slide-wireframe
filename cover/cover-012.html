<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-012</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#333;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .c{position:absolute;left:0;width:1280px;transform:translateY(-50%);text-align:center;color:#fff}
  .logo{top:249px;font-size:100px;font-weight:700;letter-spacing:.02em}
  .sub{top:353px;font-size:41px;font-weight:700;letter-spacing:.1em}
  .deck{top:501px;font-size:28px;font-weight:700;letter-spacing:.06em}
  .date{top:569px;font-size:28px;font-weight:700;letter-spacing:.04em}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="c logo">LOGO</div>
    <div class="c sub">ダミーテキ</div>
    <div class="c deck">COMPANY DECK</div>
    <div class="c date">20XX.XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
