<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-017</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  /* 上下に断ち切りのロゴタイプ帯 */
  .band{position:absolute;left:0;width:1280px;background:#ececec;display:grid;place-items:center;
    font-size:14px;letter-spacing:.2em;color:#b3b3b3}
  .band-t{top:0;height:96px}
  .band-b{top:569px;height:151px}

  /* 右：イラスト */
  .graphic{position:absolute;left:640px;top:21px;width:640px;height:676px;background:#ededed;
    display:grid;place-items:center;font-size:16px;letter-spacing:.2em;color:#8c8c8c}

  .logo{position:absolute;left:114px;top:242px;transform:translateY(-50%);font-size:30px;font-weight:700;color:#4d4d4d}
  .title{position:absolute;left:110px;top:285px;font-size:56px;font-weight:700;line-height:60px;color:#4d4d4d}
  .sub{position:absolute;left:110px;top:452px;transform:translateY(-50%);font-size:16px;font-weight:700;color:#4d4d4d}
  .date{position:absolute;left:110px;top:480px;transform:translateY(-50%);font-size:16px;font-weight:700;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="band band-t"></div>
    <div class="band band-b"></div>
    <div class="graphic"></div>

    <div class="logo">LOGO</div>
    <div class="title">Company<br>Deck</div>
    <div class="sub">ダミーテキストダ ダミーテキスト</div>
    <div class="date">20XX.XX.XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
