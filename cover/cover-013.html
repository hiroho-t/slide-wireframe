<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-013</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  .photo{position:absolute;left:0;top:0;width:1280px;height:393px;background:#c9d2d9;
    display:grid;place-items:center;font-size:16px;letter-spacing:.2em;color:#8c8c8c}

  .name{position:absolute;left:74px;top:526px;transform:translateY(-50%);font-size:23px;font-weight:700;color:#1a1a1a}
  .bar{position:absolute;left:293px;top:508px;width:1px;height:36px;background:#c4c4c4}
  .logo{position:absolute;left:311px;top:526px;transform:translateY(-50%);font-size:23px;font-weight:700;color:#4d4d4d}

  .title{position:absolute;left:74px;top:610px;transform:translateY(-50%);font-size:54px;font-weight:700;color:#4d4d4d}
  .date{position:absolute;right:103px;top:629px;transform:translateY(-50%);font-size:12px;font-weight:700;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="photo">IMAGE</div>

    <div class="name">ダミーテキス</div>
    <div class="bar"></div>
    <div class="logo">LOGO</div>

    <div class="title">Company Deck</div>
    <div class="date">20XX年X月X日 ダミ</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
