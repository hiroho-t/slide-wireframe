<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-006</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#f2f2f2;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  /* 背景：左上から右下へ斜めに切った面（上下左右の端は直線・余白なし） */
  .shape{position:absolute;left:0;top:0;width:1280px;height:720px}

  /* 左上：資料名ラベル */
  .label{position:absolute;left:68px;top:84px;transform:translateY(-50%);font-size:19px;font-weight:700;color:#1a1a1a}

  /* 左：英字の大見出し2行 */
  .title{position:absolute;left:68px;top:125px;font-size:124px;line-height:1.12;font-weight:700;letter-spacing:-.01em;color:#1a1a1a}

  /* 左下：日付 */
  .date{position:absolute;left:68px;top:633px;transform:translateY(-50%);font-size:19px;font-weight:700;color:#1a1a1a}
  /* 右下：会社ロゴ */
  .logo-br{position:absolute;right:43px;top:633px;transform:translateY(-50%);font-size:40px;font-weight:700;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <svg class="shape" viewBox="0 0 1280 720">
      <path d="M718 0 L1280 0 L1280 720 L0 720 L0 562 Z" fill="#c9c9c9"/>
    </svg>

    <div class="label">ダミー株式会社 ダミー資料名</div>

    <div class="title">COMPANY<br>DECK</div>

    <div class="date">20XX.XX.XX</div>
    <div class="logo-br">LOGO</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
