<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-009</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);
    background:linear-gradient(110deg,#8c8c8c 0%,#a3a3a3 40%,#c4c4c4 75%,#dedede 100%);letter-spacing:.8px}

  /* 左半分：大きなグラフィック */
  .graphic{position:absolute;left:0;top:0;width:498px;height:720px;background:rgba(255,255,255,.14);
    display:grid;place-items:center;font-size:16px;letter-spacing:.2em;color:rgba(255,255,255,.85)}

  .logo{position:absolute;left:551px;top:167px;transform:translateY(-50%);font-size:34px;font-weight:700;color:#fff}
  .title{position:absolute;left:544px;top:250px;font-size:118px;font-weight:700;line-height:128px;letter-spacing:-.01em;color:#fff}
  .date{position:absolute;left:555px;top:638px;transform:translateY(-50%);font-size:17px;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="graphic"></div>

    <div class="logo">LOGO</div>
    <div class="title">Company<br>Deck</div>
    <div class="date">July 00, 20XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
