<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-002</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#6e6e6e;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}


  /* 左上：白の斜めコーナー */
  .corner{position:absolute;left:0;top:0;width:1280px;height:720px;background:#fff;clip-path:polygon(0 0,416px 0,0 198px)}

  /* コーナー内のロゴ */
  .logo{position:absolute;left:48px;top:92px;transform:translateY(-50%);font-size:26px;font-weight:700;color:#1a1a1a}

  /* センターのタイトル群 */
  .org{position:absolute;left:0;width:1280px;top:252px;transform:translateY(-50%);text-align:center;font-size:32px;font-weight:700;color:#fff}
  .title{position:absolute;left:0;width:1280px;top:373px;transform:translateY(-50%);text-align:center;font-size:61px;font-weight:700;color:#fff}
  .term{position:absolute;left:0;width:1280px;top:458px;transform:translateY(-50%);text-align:center;font-size:26px;font-weight:700;color:#fff}
  .date{position:absolute;left:0;width:1280px;top:582px;transform:translateY(-50%);text-align:center;font-size:17px;font-weight:700;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="corner"></div>
    <div class="logo">LOGO</div>

    <div class="org">ダミーグループ名</div>
    <div class="title">ダミー見出し</div>
    <div class="term">〔20XX年度～20XX年度〕</div>
    <div class="date">20XX年X月XX日</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
