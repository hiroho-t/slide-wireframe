<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-018</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .logo{position:absolute;left:51px;top:331px;transform:translateY(-50%);font-size:74px;font-weight:700;letter-spacing:.01em;color:#1a1a1a}
  .title{position:absolute;left:51px;top:400px;transform:translateY(-50%);font-size:28px;letter-spacing:.02em;color:#333}

  .foot{position:absolute;right:43px;top:697px;transform:translateY(-50%);font-size:12px;color:#1a1a1a}
  .foot i{font-style:normal;margin:0 14px}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="logo">LOGO</div>
    <div class="title">CORPORATE PROFILE</div>

    <div class="foot">Last Updated : 20XX-XX-XX<i></i>Ver. 0.0<i></i>© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
