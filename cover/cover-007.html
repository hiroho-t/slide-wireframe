<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-007</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  /* 背景：淡いグラデーション（左上→右下） */
  .slide{position:relative;width:1280px;height:720px;background:linear-gradient(115deg,#e6e6e6 0%,#f7f7f7 35%,#fdfdfd 60%,#efefef 100%);overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  /* 左寄せ：ロゴ／資料名／日付 */
  .logo{position:absolute;left:121px;top:274px;transform:translateY(-50%);font-size:55px;font-weight:700;color:#1a1a1a}
  .title{position:absolute;left:121px;top:391px;transform:translateY(-50%);font-size:41px;font-weight:700;color:#1a1a1a}
  .date{position:absolute;left:121px;top:461px;transform:translateY(-50%);font-size:21px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="logo">LOGO</div>
    <div class="title">ダミー資料名</div>
    <div class="date">20XX.XX.XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
