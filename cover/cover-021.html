<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-021</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  /* 写真タイル（上段3枚・下段2枚） */
  .ph{position:absolute;background:#c9c9c9;border-radius:14px;display:grid;place-items:center;
    font-size:15px;letter-spacing:.2em;color:#8c8c8c}
  .p1{left:16px;top:16px;width:502px;height:312px}
  .p2{left:532px;top:16px;width:455px;height:312px}
  .p3{left:1001px;top:16px;width:263px;height:312px}
  .p4{left:610px;top:342px;width:314px;height:362px}
  .p5{left:938px;top:342px;width:326px;height:362px}

  /* 左下のタイトルパネル */
  .panel{position:absolute;left:16px;top:342px;width:580px;height:362px;background:#757575;border-radius:14px}
  .title{position:absolute;left:56px;top:380px;font-size:50px;font-weight:700;line-height:1.16;letter-spacing:-.01em;color:#fff}
  .year{position:absolute;left:56px;top:578px;width:125px;height:36px;border-radius:18px;background:#fff;
    display:grid;place-items:center;font-size:19px;font-weight:700;letter-spacing:.02em;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="ph p1">IMAGE</div>
    <div class="ph p2">IMAGE</div>
    <div class="ph p3">IMAGE</div>
    <div class="ph p4">IMAGE</div>
    <div class="ph p5">IMAGE</div>

    <div class="panel"></div>
    <div class="title">Dummydum’s<br>Dummytextdumm<br>Dummyte</div>
    <div class="year">20XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
