<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-011</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);
    background:linear-gradient(120deg,#fbfbfc 0%,#f4f5f7 50%,#eceef1 100%)}

  .logo{position:absolute;left:75px;top:363px;transform:translateY(-50%);font-size:34px;font-weight:700;letter-spacing:.06em;color:#1a1a1a}

  .name{position:absolute;right:71px;top:315px;transform:translateY(-50%);font-size:14px;color:#1a1a1a}
  .title{position:absolute;right:71px;top:363px;transform:translateY(-50%);font-size:54px;font-weight:700;letter-spacing:.01em;color:#2b3440}
  .copy{position:absolute;right:71px;top:398px;transform:translateY(-50%);font-size:12px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="logo">LOGO</div>

    <div class="name">ダミーテキストダミー</div>
    <div class="title">Company Deck</div>
    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
