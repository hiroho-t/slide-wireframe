<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-005</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#6b6b6b;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}


  /* 中央：ロゴ／サブタイトル／更新日（等間隔） */
  .center{position:absolute;left:0;top:273px;width:1280px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;color:#fff}
  .logo{font-size:140px;line-height:1;font-weight:200}
  .sub{font-size:12px;line-height:1;font-weight:200}
  .sub i{display:inline-block;margin:0 14px;font-style:normal;color:rgba(255,255,255,.6)}
  .update{font-size:18px;line-height:1}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="center">
      <div class="logo">LOGO</div>
      <div class="sub">ダミー株式会社名<i>|</i>ダミー名</div>
      <div class="update">UPDATE 20XX.X</div>
    </div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
