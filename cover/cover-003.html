<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-003</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#757575;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}


  /* 右上：社名＋日付 */
  .meta{position:absolute;right:40px;top:64px;transform:translateY(-50%);font-size:18px;color:#fff;white-space:nowrap}
  .meta i{display:inline-block;margin:0 22px;font-style:normal;color:rgba(255,255,255,.55)}

  /* 左上：サービスロゴ＋サービス名 */
  .logo{position:absolute;left:83px;top:100px;transform:translateY(-50%);font-size:19px;font-weight:700;line-height:1.15;color:#fff}
  .service{position:absolute;left:206px;top:115px;transform:translateY(-50%);font-size:26px;color:#fff;white-space:nowrap}
  .service b{font-weight:700}
  .divider{position:absolute;left:83px;top:145px;width:490px;height:30px}

  /* 見出し群（左揃え） */
  .lead{position:absolute;left:93px;top:234px;transform:translateY(-50%);font-size:25px;font-weight:700;color:#fff}
  .title-en{position:absolute;left:96px;top:335px;transform:translateY(-50%);font-size:90px;font-weight:400;color:#fff}
  .title-jp{position:absolute;left:98px;top:450px;transform:translateY(-50%);font-size:58px;font-weight:700;color:#fff}

  /* 左下：認証ラベル2つ（ロゴではなく認定・資格の証明バッジ） */
  .badge{position:absolute;top:597px;height:54px;background:#fff;border-radius:4px;display:grid;place-items:center;text-align:center;font-size:14px;font-weight:700;line-height:1.25;color:#1a1a1a}
  .badge-1{left:85px;width:172px}
  .badge-2{left:291px;width:175px}
  .badge small{display:block;font-size:11px;font-weight:400;color:#666}

  /* 右下：会社ロゴ */
  .logo-br{position:absolute;right:40px;top:632px;transform:translateY(-50%);font-size:26px;font-weight:700;line-height:1.15;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="meta">ダミーテキスト名株式会社<i>|</i>20XX.XX</div>

    <div class="logo">SERVICE<br>LOGO</div>
    <div class="service">ダミーです <b>ダミーテキスト名</b></div>
    <svg class="divider" viewBox="0 0 490 30">
      <path d="M0 10 L115 10" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.5" fill="none"/>
      <path d="M123 23 L141 5 L482 5" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.5" fill="none"/>
    </svg>

    <div class="lead">ダミーテキストがここに入るリード文になります。</div>
    <div class="title-en">SAMPLE</div>
    <div class="title-jp">ダミータイトル名</div>

    <div class="badge badge-1">認証ラベル01<small>ダミーテキスト</small></div>
    <div class="badge badge-2">認証ラベル02<small>ダミーテキスト</small></div>
    <div class="logo-br">COMPANY<br>LOGO</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
