<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-019</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#d9d9d9;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .logo{position:absolute;left:132px;top:286px;transform:translateY(-50%);font-size:130px;font-weight:700;letter-spacing:.01em;color:#1a1a1a}
  .title{position:absolute;left:132px;top:445px;transform:translateY(-50%);font-size:32px;font-weight:700;letter-spacing:.18em;color:#1a1a1a}
  .date{position:absolute;left:132px;top:492px;transform:translateY(-50%);font-size:20px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="logo">LOGO</div>
    <div class="title">CULTURE DECK</div>
    <div class="date">20XX.XX Updated</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
