<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-020</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .grad{position:absolute;left:0;top:0;width:1280px;height:720px;
    background:radial-gradient(58% 62% at 82% 74%,#d3d3d3 0%,#e6e6e6 45%,rgba(255,255,255,0) 72%)}

  .logo{position:absolute;left:79px;top:303px;transform:translateY(-50%);font-size:40px;font-weight:700;letter-spacing:.22em;color:#1a1a1a}
  .title{position:absolute;left:79px;top:401px;transform:translateY(-50%);font-size:22px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .rule{position:absolute;left:82px;top:442px;width:28px;height:1px;background:#4d4d4d}
  .sub{position:absolute;left:116px;top:442px;transform:translateY(-50%);font-size:14px;letter-spacing:.02em;color:#1a1a1a}
  .date{position:absolute;left:80px;top:498px;transform:translateY(-50%);font-size:11px;letter-spacing:.02em;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="grad"></div>

    <div class="logo">LOGO</div>
    <div class="title">ダミーテキス</div>
    <div class="rule"></div>
    <div class="sub">Ddummyd/Uummydum Mmydummy</div>
    <div class="date">Mdum Ymydummy du 0000.00</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
