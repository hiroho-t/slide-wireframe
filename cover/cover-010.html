<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-010</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  .panel{position:absolute;left:0;top:0;width:640px;height:720px;background:#d9d9d9}
  .photo{position:absolute;left:640px;top:0;width:640px;height:720px;background:#c4c4c4;
    display:grid;place-items:center;font-size:16px;letter-spacing:.2em;color:#8c8c8c}

  .logo{position:absolute;left:71px;top:192px;transform:translateY(-50%);font-size:42px;font-weight:700;color:#1a1a1a}
  .title{position:absolute;left:71px;top:320px;font-size:72px;font-weight:700;line-height:85px;color:#1a1a1a}
  .date{position:absolute;left:71px;top:665px;transform:translateY(-50%);font-size:12px;color:#1a1a1a}

  .copy{position:absolute;left:1259px;top:555px;transform:translateX(-50%);writing-mode:vertical-rl;font-size:11px;color:rgba(255,255,255,.8)}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="panel"></div>
    <div class="photo">IMAGE</div>

    <div class="logo">LOGO</div>
    <div class="title">COMPANY<br>DECK</div>
    <div class="date">Last Update 20XX .00</div>

    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
