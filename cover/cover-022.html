<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-022</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  /* 左：全面写真 */
  .photo{position:absolute;left:0;top:0;width:1037px;height:720px;background:#b3b3b3;
    display:grid;place-items:center;font-size:16px;letter-spacing:.2em;color:#e0e0e0}

  /* 写真上のタイトル群（右揃え） */
  .ov-logo{position:absolute;right:294px;top:80px;transform:translateY(-50%);font-size:52px;font-weight:700;letter-spacing:.06em;color:#fff}
  .ov-title{position:absolute;right:320px;top:131px;transform:translateY(-50%);font-size:29px;font-weight:700;letter-spacing:.02em;color:#fff}
  .ov-sub{position:absolute;right:320px;top:171px;transform:translateY(-50%);font-size:12px;font-weight:700;letter-spacing:.02em;color:#fff}

  /* 右：サイドパネル */
  .side-logo{position:absolute;left:1062px;top:32px;transform:translateY(-50%);font-size:20px;font-weight:700;letter-spacing:.1em;color:#1a1a1a}
  .side-title{position:absolute;left:1057px;top:109px;transform:translateY(-50%);font-size:19px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .side-sub{position:absolute;left:1057px;top:128px;transform:translateY(-50%);font-size:10px;letter-spacing:.02em;color:#8c8c8c}

  .list{position:absolute;left:1053px;top:162px;width:196px;border-top:1px solid #dcdcdc}
  .row{display:flex;align-items:center;height:25px;border-bottom:1px solid #dcdcdc}
  .row .no{width:32px;font-size:11px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .row .lb{font-size:10px;letter-spacing:.02em;color:#4d4d4d;white-space:nowrap}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="photo">IMAGE</div>

    <div class="ov-logo">LOGO</div>
    <div class="ov-title">ダミーテキス20XX</div>
    <div class="ov-sub">20XX年度（20XX年X月期）</div>

    <div class="side-logo">LOGO</div>
    <div class="side-title">ダミーテキス20XX</div>
    <div class="side-sub">ダミーテキスト株式会社</div>

    <div class="list">
      <div class="row"><span class="no">01</span><span class="lb">ダミーグループが目指す未来</span></div>
      <div class="row"><span class="no">02</span><span class="lb">ダミーテキストメッセージ</span></div>
      <div class="row"><span class="no">03</span><span class="lb">ダミー環境分析とダミーテキスト</span></div>
      <div class="row"><span class="no">04</span><span class="lb">ダミー優位を確立するための戦略</span></div>
      <div class="row"><span class="no">05</span><span class="lb">ダミー的に成長するための基盤強化</span></div>
      <div class="row"><span class="no">06</span><span class="lb">ダミーセクション</span></div>
    </div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
