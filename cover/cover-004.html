<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-004</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}


  /* 右：ドットグリッド */
  .dots{position:absolute;left:1166px;top:305px;width:112px;height:122px}
  .dots i{position:absolute;width:9px;height:9px;border-radius:50%;background:#ededed}

  /* 中央：ロゴ＋タイトル */
  .logo{position:absolute;left:0;width:1280px;top:287px;transform:translateY(-50%);text-align:center;font-size:48px;font-weight:700;color:#1a1a1a}
  .title{position:absolute;left:0;width:1280px;top:392px;transform:translateY(-50%);text-align:center;font-size:64px;font-weight:700;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="dots">
      <i style="left:0;top:0"></i><i style="left:36px;top:0"></i><i style="left:69px;top:0"></i><i style="left:101px;top:0"></i>
      <i style="left:0;top:37px"></i><i style="left:36px;top:37px"></i><i style="left:69px;top:37px"></i><i style="left:101px;top:37px"></i>
      <i style="left:0;top:74px"></i><i style="left:36px;top:74px"></i><i style="left:69px;top:74px"></i><i style="left:101px;top:74px"></i>
      <i style="left:0;top:111px"></i><i style="left:36px;top:111px"></i><i style="left:69px;top:111px"></i><i style="left:101px;top:111px"></i>
    </div>

    <div class="logo">LOGO</div>
    <div class="title">ダミー資料名</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
