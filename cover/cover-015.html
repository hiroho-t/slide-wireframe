<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-015</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);
    background:linear-gradient(115deg,#fafafa 0%,#e4e6ea 45%,#a8adb5 100%)}

  .logo{position:absolute;right:37px;top:63px;transform:translateY(-50%);font-size:26px;font-weight:700;letter-spacing:.02em;color:#fff}

  .dot{position:absolute;left:119px;top:292px;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;background:#4d4d4d}
  .lb{position:absolute;left:138px;top:292px;transform:translateY(-50%);font-size:17px;font-weight:700;letter-spacing:.02em;color:#4d4d4d}
  .title{position:absolute;left:124px;top:388px;transform:translateY(-50%);font-size:64px;font-weight:700;letter-spacing:.02em;color:#3f4a5a}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="logo">LOGO</div>

    <i class="dot"></i>
    <div class="lb">Products &amp; Services</div>
    <div class="title">ダミーテキストダミ</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
