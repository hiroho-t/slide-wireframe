<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cover-008</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#262626;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  /* 左上：更新日 */
  .date{position:absolute;left:49px;top:30px;transform:translateY(-50%);font-size:16px;line-height:1;font-weight:700;color:#fff}

  /* 中央：ロゴ／サブタイトル（左右中央・行は右揃え） */
  .center{position:absolute;left:0;top:293px;width:1280px;text-align:center;color:#fff}
  .center > div{display:inline-block;text-align:right}
  .logo{font-size:136px;line-height:1;font-weight:700;letter-spacing:-.01em}
  .sub{margin-top:13px;font-size:26px;line-height:1;font-weight:700}

  /* 右下：コピーライト */
  .copy{position:absolute;right:56px;top:692px;transform:translateY(-50%);font-size:15px;line-height:1;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="date">As of XXX. 20XX</div>

    <div class="center">
      <div>
        <div class="logo">LOGO</div>
        <div class="sub">Company Deck</div>
      </div>
    </div>

    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
