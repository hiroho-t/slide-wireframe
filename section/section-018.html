<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-018</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#d9d9d9;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  .no{position:absolute;left:134px;top:288px;transform:translateY(-50%);font-size:172px;font-weight:700;line-height:1;color:#1a1a1a}
  .en{position:absolute;left:134px;top:439px;transform:translateY(-50%);font-size:21px;font-weight:700;letter-spacing:.3em;color:#1a1a1a}
  .ja{position:absolute;left:134px;top:489px;transform:translateY(-50%);font-size:25px;color:#1a1a1a}

  .page{position:absolute;right:10px;top:697px;transform:translateY(-50%);font-size:11px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="no">01</div>
    <div class="en">COMPANY</div>
    <div class="ja">ダミーテキス</div>

    <div class="page">3</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
