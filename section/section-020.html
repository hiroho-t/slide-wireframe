<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-020</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);font-feature-settings:"palt" 1}

  /* 右上を切り欠いた角丸パネル */
  .p1{position:absolute;left:19px;top:19px;width:1081px;height:52px;background:#ededed;border-radius:24px 24px 0 0}
  .p2{position:absolute;left:19px;top:70px;width:1243px;height:632px;background:#ededed;border-radius:0 24px 24px 24px}

  .logo{position:absolute;right:18px;top:35px;transform:translateY(-50%);font-size:20px;font-weight:700;letter-spacing:.12em;color:#1a1a1a}

  .ch{position:absolute;left:0;top:241px;width:1280px;text-align:center;transform:translateY(-50%);
    font-size:16px;font-weight:700;letter-spacing:.06em;color:#1a1a1a}
  .no{position:absolute;left:0;top:290px;width:1280px;text-align:center;transform:translateY(-50%);
    font-size:60px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .ul{position:absolute;left:597px;top:339px;width:86px;height:4px;background:#1a1a1a}
  .ttl{position:absolute;left:0;top:427px;width:1280px;text-align:center;transform:translateY(-50%);
    font-size:57px;font-weight:700;letter-spacing:.04em;color:#1a1a1a}

  .cp{position:absolute;right:55px;top:686px;transform:translateY(-50%);font-size:11px;color:#4d4d4d}
  .pn{position:absolute;right:25px;top:686px;transform:translateY(-50%);font-size:13px;font-weight:700;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="p1"></div>
    <div class="p2"></div>
    <div class="logo">LOGO</div>

    <div class="ch">Chapter</div>
    <div class="no">01</div>
    <div class="ul"></div>
    <div class="ttl">ダミーテキストダ</div>

    <div class="cp">© 20XX Company.</div>
    <div class="pn">00</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
