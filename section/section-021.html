<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-021</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);font-feature-settings:"palt" 1}

  .tab{position:absolute;left:64px;top:0;width:166px;height:6px;background:#4d4d4d}
  .sec{position:absolute;left:64px;top:22px;transform:translateY(-50%);font-size:11px;font-weight:700;letter-spacing:.06em;color:#4d4d4d}
  .photo{position:absolute;left:242px;top:110px;width:793px;height:610px;background:#8c8c8c}
  .photo span{position:absolute;right:20px;bottom:14px;font-size:12px;letter-spacing:.2em;color:#e0e0e0}
  .en{position:absolute;left:64px;top:113px;transform:translateY(-50%);font-size:64px;font-weight:700;letter-spacing:.01em;color:#4d4d4d}
  .jp{position:absolute;left:64px;transform:translateY(-50%);font-size:30px;font-weight:500;letter-spacing:.06em;color:#4d4d4d}
  .cap{position:absolute;left:64px;top:405px;transform:translateY(-50%);font-size:15px;font-weight:700;letter-spacing:.02em;color:#4d4d4d}
  .cr{position:absolute;left:64px;top:405px;width:38px;height:1px;background:#4d4d4d}
  .rl{position:absolute;left:64px;top:485px;transform:translateY(-50%);font-size:11px;letter-spacing:.02em;color:#4d4d4d}
  .nm{position:absolute;left:64px;top:512px;transform:translateY(-50%);font-size:19px;font-weight:700;letter-spacing:.06em;color:#4d4d4d}
  .ne{position:absolute;left:64px;top:534px;transform:translateY(-50%);font-size:11px;letter-spacing:.08em;color:#8c8c8c}
  .sg{position:absolute;left:64px;top:558px;width:150px;height:52px;background:#ededed;display:grid;place-items:center;
    font-size:9px;letter-spacing:.16em;color:#8c8c8c}

  .side{position:absolute;left:1035px;top:0;width:245px;height:720px;background:#ededed}
  .nv{position:absolute;left:1043px;width:229px;display:flex;align-items:center;gap:8px}
  .nv.on{background:#fff}
  .nb{width:26px;height:calc(100% - 8px);margin:4px 0 4px 4px;background:#b3b3b3;flex:none;
    display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
  .nl{font-size:11px;line-height:15px;letter-spacing:.02em;color:#4d4d4d}
  .nv.on .nl{color:#1a1a1a;font-weight:700;padding-left:34px}
  .nv.on::before{content:"";position:absolute;left:4px;top:4px;width:26px;height:calc(100% - 8px);background:#4d4d4d}
  .pn{position:absolute;left:1035px;top:640px;width:245px;text-align:center;font-size:26px;font-weight:700;color:#1a1a1a}
  .rp{position:absolute;left:1035px;top:672px;width:245px;text-align:center;font-size:10px;letter-spacing:.06em;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="tab"></div>
    <div class="sec">Dummy Dummydum</div>
    <div class="photo"><span>IMAGE</span></div>
    <div class="en">DUM MESSAGE</div>
    <div class="jp" style="top:225px">ダミーテキストダ</div>
    <div class="jp" style="top:283px">ダミーテキストダミーテキ</div>
    <div class="jp" style="top:341px">ダミーテキストダ。</div>
    <div class="cr"></div>
    <div class="cap" style="left:116px">ダミーテキストダミーテキ、ダミーテキストダ。</div>
    <div class="rl">ダミーテキストダ ダミーテキストダ</div>
    <div class="nm">ダミー ダミーテ</div>
    <div class="ne">DUMMYD DUMMYD</div>
    <div class="sg">SIGN</div>

    <div class="side"></div>
    <div class="nv" style="top:80px;height:30px"><span class="nl">Introduction</span></div>
    <div class="nv on" style="top:114px;height:40px"><span class="nb">1</span><span class="nl">Value<br>Creation</span></div>
    <div class="nv" style="top:158px;height:40px"><span class="nb">2</span><span class="nl">Management<br>Plan</span></div>
    <div class="nv" style="top:202px;height:40px"><span class="nb">3</span><span class="nl">Core<br>Strategies</span></div>
    <div class="nv" style="top:246px;height:40px"><span class="nb">4</span><span class="nl">Management<br>Foundation</span></div>
    <div class="nv" style="top:290px;height:30px"><span class="nl">Data Section</span></div>
    <div class="pn">00</div>
    <div class="rp">DUMMY REPORT 20XX</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
