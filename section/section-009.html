<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-009</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  /* 背景：淡いグラデーション（左上→右下） */
  .slide{position:relative;width:1280px;height:720px;background:linear-gradient(115deg,#e6e6e6 0%,#f7f7f7 35%,#fdfdfd 60%,#efefef 100%);overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  .brand{position:absolute;left:32px;top:35px;transform:translateY(-50%);font-size:26px;line-height:1;font-weight:700;color:#1a1a1a}
  .ttl{position:absolute;left:119px;top:343px;transform:translateY(-50%);font-size:47px;line-height:1;font-weight:700;color:#1a1a1a}

  .bar{position:absolute;left:0;bottom:0;width:1280px;height:4px;background:#e0e0e0}
  .bar::before{content:"";position:absolute;left:0;top:0;width:48px;height:4px;background:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="brand">LOGO</div>
    <div class="ttl">項目名称</div>

    <div class="bar"></div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
