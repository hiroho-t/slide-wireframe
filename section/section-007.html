<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-007</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#757575;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  /* 中央左：番号＋縦バー＋見出し */
  .no{position:absolute;left:85px;top:346px;transform:translateY(-50%);font-size:54px;line-height:1;font-weight:700;color:#fff}
  .bar{position:absolute;left:192px;top:323px;width:3px;height:51px;background:#fff}
  .ttl{position:absolute;left:240px;top:349px;transform:translateY(-50%);font-size:50px;line-height:1;font-weight:700;color:#fff}

  /* 左下：ロゴ */
  .logo{position:absolute;left:78px;top:635px;transform:translateY(-50%);font-size:40px;line-height:1;font-weight:700;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="no">01</div>
    <div class="bar"></div>
    <div class="ttl">項目名称</div>

    <div class="logo">LOGO</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
