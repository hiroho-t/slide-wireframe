<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-017</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  /* 上下に断ち切りの大きなロゴタイプ帯 */
  .band{position:absolute;left:0;width:1280px;background:#ececec;display:grid;place-items:center;
    font-size:14px;letter-spacing:.2em;color:#b3b3b3}
  .band-t{top:0;height:167px}
  .band-b{top:562px;height:158px}

  .badge{position:absolute;left:642px;top:277px;transform:translate(-50%,-50%);width:75px;height:75px;border-radius:50%;
    background:#7a7a7a;display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff}
  .title{position:absolute;left:0;width:1280px;top:380px;transform:translateY(-50%);text-align:center;font-size:76px;font-weight:700;letter-spacing:.02em;color:#4d4d4d}
  .en{position:absolute;left:0;width:1280px;top:452px;transform:translateY(-50%);text-align:center;font-size:21px;font-weight:700;letter-spacing:.02em;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="band band-t"></div>
    <div class="band band-b"></div>

    <div class="badge">01</div>
    <div class="title">ダミーテキスト</div>
    <div class="en">Our Company</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
