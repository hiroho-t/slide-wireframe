<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-013</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  /* 全面の写真 */
  .photo{position:absolute;inset:0;background:#b3b3b3;display:grid;place-items:center;font-size:16px;letter-spacing:.2em;color:#e6e6e6}

  .no{position:absolute;left:134px;top:344px;transform:translateY(-50%);font-size:28px;font-weight:700;letter-spacing:.04em;color:#fff}
  .ja{position:absolute;left:200px;top:344px;transform:translateY(-50%);font-size:28px;font-weight:700;letter-spacing:.04em;color:#fff}
  .en{position:absolute;left:134px;top:388px;transform:translateY(-50%);font-size:16px;letter-spacing:.02em;color:#fff}

  .logo{position:absolute;left:40px;top:692px;transform:translateY(-50%);font-size:18px;font-weight:700;letter-spacing:.06em;color:#fff}
  .copy{position:absolute;right:28px;top:692px;transform:translateY(-50%);font-size:12px;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="photo">IMAGE</div>

    <div class="no">01</div>
    <div class="ja">ダミーテ</div>
    <div class="en">Company Overview</div>

    <div class="logo">LOGO</div>
    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
