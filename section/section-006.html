<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-006</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#6b6b6b;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  .num{position:absolute;left:110px;top:359px;transform:translateY(-50%);font-size:51px;font-weight:600;color:rgba(255,255,255,.5)}
  .title{position:absolute;left:171px;top:359px;transform:translateY(-50%);font-size:56px;font-weight:700;color:#fff}

  .copy{position:absolute;left:25px;top:691px;transform:translateY(-50%);font-size:11px;color:#fff}
  .page{position:absolute;right:11px;top:704px;transform:translateY(-50%);font-size:10px;color:rgba(255,255,255,.6)}
  .bar{position:absolute;left:21px;top:715px;width:39px;height:5px;background:#3f3f3f}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="num">1</div>
    <div class="title">項目名称</div>
    <div class="copy">© 20XX Company.</div>
    <div class="page">1</div>
    <div class="bar"></div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
