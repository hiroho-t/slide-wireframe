<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-016</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  .brand{position:absolute;left:35px;top:24px;transform:translateY(-50%);font-size:12px;font-weight:700;color:#4d4d4d}
  .dot{position:absolute;left:128px;top:24px;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:#b3b3b3}
  .deck{position:absolute;left:145px;top:24px;transform:translateY(-50%);font-size:12px;color:#8c8c8c}

  .title{position:absolute;left:113px;top:365px;transform:translateY(-50%);font-size:66px;font-weight:700;color:#1a1a1a}

  .page{position:absolute;right:29px;top:705px;transform:translateY(-50%);font-size:11px;letter-spacing:.2em;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="brand">LOGO</div>
    <i class="dot"></i>
    <div class="deck">Ddummyd Uumm</div>

    <div class="title">ダミーテキ</div>

    <div class="page">・8・</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
