<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-003</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#757575;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}


  .logo{position:absolute;right:40px;top:86px;transform:translateY(-50%);font-size:26px;font-weight:700;color:#fff}
  .badge{position:absolute;left:640px;top:271px;transform:translate(-50%,-50%);width:79px;height:79px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:600;color:#fff}
  .title{position:absolute;left:0;width:1280px;top:397px;transform:translateY(-50%);text-align:center;font-size:46px;font-weight:700;color:#fff}

  .copy{position:absolute;left:39px;top:695px;transform:translateY(-50%);font-size:10px;color:rgba(255,255,255,.9)}
  .page{position:absolute;right:21px;top:695px;transform:translateY(-50%);font-size:10px;color:rgba(255,255,255,.9)}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="logo">LOGO</div>
    <div class="badge">01</div>
    <div class="title">ダミーテキスト名「DUMMY01」について</div>

    <div class="copy">© Dummy000. Inc.</div>
    <div class="page">5</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
