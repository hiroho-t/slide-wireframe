<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-014</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#333;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .title{position:absolute;left:121px;top:352px;transform:translateY(-50%);font-size:62px;font-weight:700;letter-spacing:.04em;color:#fff}
  .sub{position:absolute;left:208px;top:421px;transform:translateY(-50%);font-size:17px;font-weight:700;letter-spacing:.1em;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="title">1. ダミーテ</div>
    <div class="sub">Who dummy?</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
