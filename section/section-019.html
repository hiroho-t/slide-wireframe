<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-019</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#282828;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .bigno{position:absolute;left:-9px;top:-56px;font-size:300px;font-weight:700;line-height:1;letter-spacing:-.04em;color:#9aa5bd}

  .title{position:absolute;left:246px;top:188px;transform:translateY(-50%);font-size:92px;font-weight:700;line-height:1;letter-spacing:-.01em;color:#fff}
  .sub{position:absolute;left:251px;top:250px;transform:translateY(-50%);font-size:15px;font-weight:700;letter-spacing:.02em;color:#fff}

  .logo{position:absolute;right:32px;top:634px;transform:translateY(-50%);font-size:44px;font-weight:700;letter-spacing:.02em;color:#fff}

  .fl{position:absolute;left:32px;top:688px;transform:translateY(-50%);font-size:11px;color:#9a9a9a}
  .fr{position:absolute;right:77px;top:688px;transform:translateY(-50%);font-size:11px;color:#9a9a9a}
  .pg{position:absolute;right:33px;top:688px;transform:translateY(-50%);font-size:11px;color:#9a9a9a}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="bigno">0</div>

    <div class="title">DUMMYDU</div>
    <div class="sub">MdummMydダミーテ</div>

    <div class="logo">LOGO</div>

    <div class="fl">YummyDdu Umm. Mydummy Mdum 0000</div>
    <div class="fr">© 20XX Company.</div>
    <div class="pg">13</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
