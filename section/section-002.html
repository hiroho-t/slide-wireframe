<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-002</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#6e6e6e;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}


  /* 中央：六角形の章番号 */
  .hex{position:absolute;left:640px;top:242px;transform:translate(-50%,-50%);width:77px;height:86px;background:#b3b3b3;
    clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;
    font-size:26px;font-weight:700;color:#fff}

  .t1{position:absolute;left:0;width:1280px;top:349px;transform:translateY(-50%);text-align:center;font-size:46px;font-weight:700;color:#fff}
  .t2{position:absolute;left:0;width:1280px;top:406px;transform:translateY(-50%);text-align:center;font-size:26px;font-weight:700;color:#fff}
  .t3{position:absolute;left:0;width:1280px;top:454px;transform:translateY(-50%);text-align:center;font-size:40px;font-weight:700;color:#fff}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">

    <div class="hex">2</div>
    <div class="t1">ダミー見出し名</div>
    <div class="t2">〔20XX年度～20XX年度〕</div>
    <div class="t3">のダミー名</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
