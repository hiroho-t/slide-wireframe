<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-010</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);
    background:linear-gradient(120deg,#c9c9c9 0%,#e6e6e6 30%,#9e9e9e 55%,#d6d6d6 80%,#efefef 100%)}

  .logo{position:absolute;left:34px;top:54px;transform:translateY(-50%);font-size:26px;font-weight:700;letter-spacing:.04em;color:#fff}
  .no{position:absolute;right:99px;top:103px;font-size:174px;font-weight:700;line-height:1;color:#fff}
  .title{position:absolute;left:103px;top:562px;transform:translateY(-50%);font-size:92px;font-weight:700;letter-spacing:.02em;color:#fff}

  .foot{position:absolute;left:32px;top:688px;transform:translateY(-50%);font-size:13px;color:#1a1a1a}
  .foot i{font-style:normal;margin:0 10px;color:#8c8c8c}
  .copy{position:absolute;right:28px;top:688px;transform:translateY(-50%);font-size:12px;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="logo">LOGO</div>
    <div class="no">2</div>
    <div class="title">ダミーテ</div>

    <div class="foot">8<i>｜</i>Chapter 2</div>
    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
