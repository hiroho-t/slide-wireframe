<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>section-001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#6b6b6b;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  /* 右：多角形の写真エリア */
  .photo{position:absolute;left:0;top:0;width:1280px;height:720px;background:#d0d0d0;
    clip-path:polygon(804px 14px,1245px 14px,1280px 52px,1280px 655px,1240px 720px,818px 720px,636px 538px,636px 196px)}
  .photo-label{position:absolute;left:918px;top:367px;transform:translate(-50%,-50%);font-size:18px;letter-spacing:.2em;color:#8c8c8c}

  .logo{position:absolute;left:34px;top:30px;transform:translateY(-50%);font-size:26px;font-weight:700;color:#fff}
  .title{position:absolute;left:34px;top:343px;transform:translateY(-50%);font-size:72px;font-weight:600;color:#fff}
  .sub{position:absolute;left:34px;top:411px;transform:translateY(-50%);font-size:18px;font-weight:700;color:#fff}
  .bignum{position:absolute;left:622px;top:555px;font-size:228px;font-weight:600;line-height:.86;letter-spacing:-.01em;color:#fff}

  .copy{position:absolute;left:32px;top:693px;transform:translateY(-50%);font-size:11px;color:#fff}
  .page{position:absolute;right:29px;top:693px;transform:translateY(-50%);font-size:11px;color:#fff}
  .bar{position:absolute;left:21px;top:715px;width:32px;height:5px;background:#3f3f3f}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="photo"></div>
    <div class="photo-label">IMAGE</div>

    <div class="logo">LOGO</div>
    <div class="title">Dummy 01</div>
    <div class="sub">項目名称</div>
    <div class="bignum">01</div>

    <div class="copy">© Dummy0 Inc. 20XX</div>
    <div class="page">03</div>
    <div class="bar"></div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
