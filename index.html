<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slide-wireframe｜レイアウト一覧</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f0f0f0;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;color:#1a1a1a;-webkit-font-smoothing:antialiased}
  header{padding:44px 40px 28px;border-bottom:1px solid #ddd;background:#fff;
    display:flex;justify-content:space-between;align-items:flex-start;gap:48px;flex-wrap:wrap}
  h1{font-size:22px;font-weight:700;letter-spacing:.04em}
  header p{font-size:12px;color:#777;margin-top:10px;line-height:1.9}
  header code{background:#f0f0f0;padding:2px 6px;font-size:11px}

  /* 取得ボタン */
  .get{flex:none;width:400px;border:1px solid #ccc;padding:16px 20px;background:#fafafa}
  .btns{display:flex;gap:10px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:40px;
    font-size:12px;font-weight:700;letter-spacing:.04em;text-decoration:none;
    border:1px solid #1a1a1a;background:#1a1a1a;color:#fff;transition:opacity .15s}
  .btn.sub{background:#fff;color:#1a1a1a}
  .btn:hover{opacity:.7}
  .btn svg{width:15px;height:15px;fill:currentColor;flex:none}
  .cmd{display:flex;align-items:stretch;margin-top:10px;border:1px solid #ddd;background:#fff}
  .cmd code{flex:1;min-width:0;padding:9px 10px;font-size:10px;line-height:1.5;color:#333;background:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cmd button{flex:none;width:64px;border:0;border-left:1px solid #ddd;background:#f0f0f0;
    font-size:10px;font-weight:700;letter-spacing:.04em;color:#1a1a1a;cursor:pointer;font-family:inherit}
  .cmd button:hover{background:#e4e4e4}
  main{padding:0 40px 64px}
  section{padding-top:44px}
  h2{font-size:15px;font-weight:700;letter-spacing:.1em;padding-bottom:14px;border-bottom:1px solid #ccc}
  h2 span{font-size:11px;font-weight:400;color:#999;margin-left:12px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px;margin-top:24px}
  .card{display:block}
  .thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;background:#fff;border:1px solid #ddd;overflow:hidden}
  .thumb iframe{width:100%;height:100%;border:0;pointer-events:none;display:block}
  .thumb::after{content:"";position:absolute;inset:0}
  .thumb:hover{border-color:#1a1a1a}
  .cap{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;gap:12px}
  .id{display:inline-flex;align-items:baseline;gap:6px;flex:none;
    font:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;color:#1a1a1a;
    background:none;border:0;padding:0;cursor:pointer}
  .id i{font-size:9px;color:#aaa;transform:translateY(-1px)}
  .id:hover{text-decoration:underline;text-underline-offset:3px}
  .id:hover i{color:#1a1a1a}
  .id.done{color:#888}
  .id.done i{color:#888}
  .memo{font-size:10px;color:#888;text-align:right;line-height:1.6}
</style>
</head>
<body>
<header>
  <div>
    <h1>slide-wireframe｜レイアウト一覧</h1>
    <p>Claude Codeのスライドのワイヤーフレームのテンプレートとして、Githubからダウンロードしてご利用いただけます。</p>
  </div>

  <div class="get">
    <div class="btns">
      <a class="btn" href="https://github.com/hiroho-t/slide-wireframe" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        GitHub リポジトリ
      </a>
      <a class="btn sub" href="https://github.com/hiroho-t/slide-wireframe/archive/refs/heads/main.zip">
        ZIP ダウンロード
      </a>
    </div>
    <div class="cmd">
      <code id="cmd">git clone https://github.com/hiroho-t/slide-wireframe.git ~/.claude/skills/slide-wireframe</code>
      <button type="button" id="copy">コピー</button>
    </div>
  </div>
</header>
<main id="app"></main>

<script>
document.getElementById('copy').addEventListener('click', async (e) => {
  const btn = e.currentTarget, text = document.getElementById('cmd').textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = 'コピー済'; }
  catch { const r = document.createRange(); r.selectNodeContents(document.getElementById('cmd'));
          getSelection().removeAllRanges(); getSelection().addRange(r); btn.textContent = '選択'; }
  setTimeout(() => btn.textContent = 'コピー', 1600);
});

const DATA = [
  ["表紙", "cover", [
    ["cover-001","白／中央揃え・サブ＋大タイトル"],
    ["cover-002","濃色／斜めコーナー＋中央見出し"],
    ["cover-003","濃色／左揃え・英字大タイトル"],
    ["cover-004","白／ロゴ＋大タイトルのみ"],
    ["cover-005","濃色／巨大ロゴ中央"],
    ["cover-006","明グレー／斜めシェイプ＋英字特大"],
    ["cover-007","グラデ／最小構成"],
    ["cover-008","黒／中央ロゴ"]
  ]],
  ["目次", "toc", [
    ["toc-001","濃色／左グラフィック＋右リスト"],
    ["toc-002","白／2階層・リーダー線（項目多）"],
    ["toc-003","白／カード＋リーダー線"],
    ["toc-004","白／番号＋項目のみ"],
    ["toc-005","白＋濃色パネル／番号大"],
    ["toc-006","白／2カラム（長い項目名）"]
  ]],
  ["中見出し", "section", [
    ["section-001","濃色／多角形写真＋巨大数字"],
    ["section-002","濃色／六角バッジ中央"],
    ["section-003","濃色／円バッジ中央"],
    ["section-004","中間色／1行のみ"],
    ["section-005","白／角丸パネル"],
    ["section-006","濃色／左揃え番号＋見出し"],
    ["section-007","濃色／番号＋バー＋大見出し"],
    ["section-008","明グレー／英字特大＋番号"],
    ["section-009","グラデ／最小構成"]
  ]],
  ["会社概要", "company", [
    ["company-001","白／罫線テーブル＋写真3点"],
    ["company-002","白／5項目＋大写真"],
    ["company-003","白／中央見出し＋2カラム会社情報"],
    ["company-004","白／項目リスト＋全高写真"],
    ["company-005","白＋濃色パネル／写真主役"],
    ["company-006","白／特大ロゴ＋パネル7項目"],
    ["company-007","白／上部ナビ＋罫線リスト"]
  ]],
  ["社長挨拶・メッセージ", "message", [
    ["message-001","白／英字大見出し＋帯背景"],
    ["message-002","白／長文12行＋全高写真"],
    ["message-003","白／大リード＋縦長写真"],
    ["message-004","白／角丸写真＋右に本文"]
  ]],
  ["メンバー紹介", "member", [
    ["member-001","白／3カラム人物カード"],
    ["member-002","白／記事3カード"],
    ["member-003","白／縦型カード（略歴長め）"]
  ]],
  ["よくある質問", "faq", [
    ["faq-001","白／Q帯＋A本文 ×4"]
  ]]
];

document.getElementById('app').innerHTML = DATA.map(([label, dir, items]) => `
  <section>
    <h2>${label}<span>${dir}/ ・ ${items.length}種</span></h2>
    <div class="grid">
      ${items.map(([id, memo]) => `
        <div class="card">
          <a class="thumb" href="${dir}/${id}.html" target="_blank" rel="noopener"><iframe src="${dir}/${id}.html" loading="lazy" scrolling="no" title="${id}"></iframe></a>
          <div class="cap">
            <button type="button" class="id" data-id="${id}" title="IDをコピー">${id}<i class="fa-regular fa-copy"></i></button>
            <span class="memo">${memo}</span>
          </div>
        </div>`).join('')}
    </div>
  </section>`).join('');

document.getElementById('app').addEventListener('click', async (e) => {
  const btn = e.target.closest('.id');
  if (!btn) return;
  const id = btn.dataset.id;
  try { await navigator.clipboard.writeText(id); }
  catch { const r = document.createRange(); r.selectNodeContents(btn);
          getSelection().removeAllRanges(); getSelection().addRange(r); }
  btn.classList.add('done');
  btn.innerHTML = 'コピーしました<i class="fa-solid fa-check"></i>';
  setTimeout(() => { btn.classList.remove('done');
    btn.innerHTML = id + '<i class="fa-regular fa-copy"></i>'; }, 1200);
});
</script>
</body>
</html>
