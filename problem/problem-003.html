<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>problem-003</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#eceef2;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .kicker{position:absolute;left:18px;top:28px;transform:translateY(-50%);font-size:13px;font-weight:700;letter-spacing:.06em;color:#1a1a1a}
  .logo{position:absolute;right:19px;top:28px;transform:translateY(-50%);font-size:22px;font-weight:700;letter-spacing:.04em;color:#1a1a1a}
  .title{position:absolute;left:0;width:1280px;top:111px;transform:translateY(-50%);text-align:center;font-size:50px;font-weight:700;letter-spacing:.02em;color:#4d4d4d}

  .pl{position:absolute;top:165px;height:35px;background:#8c8c8c;border-radius:18px;padding:0 22px;
    display:grid;place-items:center;font-size:16px;font-weight:700;color:#fff;white-space:nowrap;transform:translateX(-50%)}

  /* パネル：内側コンテンツ幅は 90%（左右に 5% ずつのパディング） */
  .pa{position:absolute;left:71px;top:182px;width:380px;height:474px;padding:0 19px;background:#e2e4e9;border-radius:16px}
  .pb{position:absolute;left:470px;top:179px;width:737px;height:477px;padding:0 37px;background:#fff;border-radius:16px}

  .li{position:absolute;left:108px;top:216px;font-size:15px;line-height:20.6px;color:#1a1a1a;white-space:nowrap}
  .li div{position:relative}
  .li div:before{content:"";position:absolute;left:-18px;top:6px;width:9px;height:9px;border-radius:50%;background:#8c8c8c}

  .doc{position:absolute;left:90px;top:330px;width:342px;height:300px;background:#fff;border:1px solid #ddd;
    display:grid;place-items:center;font-size:12px;letter-spacing:.2em;color:#8c8c8c}
  .ar{position:absolute;left:451px;top:423px;width:0;height:0;transform:translateY(-50%);
    border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:18px solid #c8cbd4}

  .tbl{position:absolute;left:507px;top:235px;width:663px;height:310px;background:#f2f2f2;border:1px solid #ddd;
    display:grid;place-items:center;font-size:13px;letter-spacing:.2em;color:#8c8c8c}
  .bd{position:absolute;left:507px;top:568px;width:663px;font-size:14px;line-height:24px;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="kicker">00.ダミーテキス</div>
    <div class="logo">LOGO</div>
    <div class="title">ダミーテキストダミーテ・キス・トダミーテ</div>

    <div class="pa"></div>
    <div class="pb"></div>

    <div class="pl" style="left:263px">ダミ</div>
    <div class="pl" style="left:838px">Dd Uummydummダミーテ</div>

    <div class="li">
      <div>ダミーテキ、スト・ダミーテキストダミ</div>
      <div>ダミーテキストダDUMミーテキストダミーテ</div>
      <div>ダミーテキスト・ダミーテキストダ</div>
      <div>ダミーテキストダミーテキストダミ</div>
    </div>

    <div class="doc">IMAGE</div>
    <div class="ar"></div>

    <div class="tbl">IMAGE</div>
    <div class="bd">ダミーテキストダミーテキス・トダミ、ダミーテキストダミーテキストダミーテキス。<br>ダミーテキストダミ、ーテ・キストダミーテキストダミーテキストダミ。</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
