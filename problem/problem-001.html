<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>problem-001</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#f5f5f5;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .title{position:absolute;left:53px;top:62px;transform:translateY(-50%);font-size:36px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .logo{position:absolute;right:44px;top:62px;transform:translateY(-50%);font-size:26px;font-weight:700;letter-spacing:.04em;color:#1a1a1a}

  .l1{position:absolute;left:0;width:1280px;top:157px;transform:translateY(-50%);text-align:center;font-size:26px;letter-spacing:.02em;color:#1a1a1a}
  .l2{position:absolute;left:0;width:1280px;top:205px;transform:translateY(-50%);text-align:center;font-size:31px;font-weight:700;letter-spacing:.02em;color:#4d4d4d}

  .card{position:absolute;top:267px;width:369px;height:266px;background:#fff}
  .ic{position:absolute;top:313px;width:67px;height:78px;transform:translateX(-50%);background:#e0e0e0;border-radius:8px}
  .sub{position:absolute;width:369px;top:443px;transform:translate(-50%,-50%);text-align:center;font-size:17px;color:#1a1a1a}
  .main{position:absolute;width:369px;top:479px;transform:translate(-50%,-50%);text-align:center;font-size:26px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}

  .co{position:absolute;top:572px;width:372px;height:82px;border:1px solid #999;border-radius:6px;
    display:grid;place-items:center;text-align:center;font-size:15px;line-height:24px;color:#1a1a1a}

  .copy{position:absolute;left:24px;top:700px;transform:translateY(-50%);font-size:12px;color:#8c8c8c}
  .num{position:absolute;right:41px;top:700px;transform:translateY(-50%);font-size:12px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="title">ダミーテキストダミーテ</div>
    <div class="logo">LOGO</div>

    <div class="l1">ダミーテキストダミーテキスト「ダミーテキス」トダミーテキストダミーテキス、</div>
    <div class="l2">ダミーテキストダ、ミーテキストダミーテキストダミーテキストダ。</div>

    <div class="card" style="left:43px"></div>
    <div class="card" style="left:456px"></div>
    <div class="card" style="left:868px"></div>

    <div class="ic" style="left:227px"></div>
    <div class="ic" style="left:640px"></div>
    <div class="ic" style="left:1052px"></div>

    <div class="sub" style="left:227px">ダミーテキスト</div>
    <div class="main" style="left:227px">ダミーテキストダミー</div>
    <div class="sub" style="left:640px">ダミーテキストダミーテキストダ</div>
    <div class="main" style="left:640px">ダミーテキストダミー</div>
    <div class="sub" style="left:1052px">ダミーテキストダミーテキスト</div>
    <div class="main" style="left:1052px">ダミーテキストダ</div>

    <div class="co" style="left:41px">ダミーテキストダミーテキストダ、<br>ダミーテキストダミーテキストダミーテ</div>
    <div class="co" style="left:454px">ダミーテキストダミーテキストダミーテキス<br>ダミーテキストダミーテキストダミ</div>
    <div class="co" style="left:866px">ダミーテキストダミーテキストダミーテキ<br>ダミーテキストダミーテキストダ</div>

    <div class="copy">© 20XX Company.</div>
    <div class="num">9</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
