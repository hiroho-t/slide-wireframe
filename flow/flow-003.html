<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flow-003</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#efefef;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  .side{position:absolute;left:0;top:0;width:44px;height:720px;background:#2b2b2b}
  .side-no{position:absolute;left:22px;top:27px;transform:translate(-50%,-50%);font-size:20px;font-weight:700;color:#fff}
  .side-rule{position:absolute;left:10px;top:44px;width:24px;height:1px;background:#fff}
  .side-ja{position:absolute;left:22px;top:60px;transform:translateX(-50%);writing-mode:vertical-rl;font-size:14px;letter-spacing:.3em;color:#fff}
  .side-logo{position:absolute;left:22px;top:619px;transform:translateX(-50%);writing-mode:vertical-rl;font-size:16px;font-weight:700;color:#fff}

  .head{position:absolute;left:85px;top:58px;transform:translateY(-50%);font-size:24px;font-weight:700;color:#1a1a1a}
  .big{position:absolute;left:44px;width:1236px;top:120px;text-align:center;font-size:42px;font-weight:700;line-height:59px;color:#1a1a1a}

  /* シェブロン4段 */
  .seg{position:absolute;top:279px;width:230px;height:111px;
    clip-path:polygon(0 0,200px 0,230px 55px,200px 111px,0 111px,30px 55px)}
  .seg:first-of-type{clip-path:polygon(0 0,200px 0,230px 55px,200px 111px,0 111px)}
  .a{background:#7a7a7a}
  .b{background:#4d4d4d}
  .lb{position:absolute;top:334px;transform:translateY(-50%);width:230px;text-align:center;
    font-size:24px;font-weight:700;color:#fff}

  /* 対応範囲のブラケット */
  .br{position:absolute;border:1px dashed #999;border-top:0;display:grid;place-items:center;
    font-size:12px;font-weight:700;color:#4d4d4d}
  .br span{background:#efefef;padding:0 10px}

  .band{position:absolute;left:199px;top:554px;width:947px;height:57px;background:#e2e2e2;
    display:grid;place-items:center;font-size:26px;font-weight:700;color:#1a1a1a}

  .copy{position:absolute;right:13px;top:682px;transform:translateY(-50%);font-size:12px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="side"></div>
    <div class="side-no">1</div>
    <div class="side-rule"></div>
    <div class="side-ja">ダミーテ</div>
    <div class="side-logo">LOGO</div>

    <div class="head">dummydダミーテキストダミーテキストダミ</div>
    <div class="big">dummydダミーテキストダミーテ、<br>ダミーテキストダミーテキストダミーテキ</div>

    <div class="seg a" style="left:199px"></div>
    <div class="seg a" style="left:437px"></div>
    <div class="seg b" style="left:675px"></div>
    <div class="seg b" style="left:913px"></div>

    <div class="lb" style="left:199px">ダミーテ</div>
    <div class="lb" style="left:437px">ダミーテ</div>
    <div class="lb" style="left:675px">ダミーテ</div>
    <div class="lb" style="left:913px">ダミ・ーテ</div>

    <div class="br" style="left:199px;top:390px;width:476px;height:78px"><span>ダミーテキストダミー</span></div>
    <div class="br" style="left:675px;top:390px;width:471px;height:142px"><span>ダミーテキストダミーテ</span></div>

    <div class="band">LOGO</div>

    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
