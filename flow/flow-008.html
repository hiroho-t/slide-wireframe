<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flow-008</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .head{position:absolute;left:40px;top:39px;transform:translateY(-50%);font-size:15px;font-weight:700;color:#1a1a1a}
  .head i{font-style:normal;margin:0 6px;color:#b3b3b3}
  .logo{position:absolute;right:42px;top:39px;transform:translateY(-50%);font-size:18px;font-weight:700;letter-spacing:.04em;color:#1a1a1a}

  .title{position:absolute;left:69px;top:109px;font-size:21px;font-weight:700;line-height:36px;letter-spacing:.02em;color:#1a1a1a;white-space:nowrap}

  .box{position:absolute;left:68px;width:1141px;height:78px;border:1px solid #999}
  .div{position:absolute;left:367px;width:1px;background:#999}
  .badge{position:absolute;left:96px;width:76px;height:24px;transform:translateY(-50%);background:#1a1a1a;border-radius:2px;
    display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff}
  .st{position:absolute;left:190px;transform:translateY(-50%);font-size:20px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .ds{position:absolute;left:436px;transform:translateY(-50%);font-size:16px;font-weight:700;color:#1a1a1a}

  .vl{position:absolute;left:229px;width:0;border-left:2px dashed #1a1a1a}
  .hl{position:absolute;height:0;border-top:2px dashed #1a1a1a}
  .down{position:absolute;width:0;height:0;border-left:9.5px solid transparent;border-right:9.5px solid transparent;border-top:14px solid #1a1a1a}
  .right{position:absolute;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:15px solid #1a1a1a}

  .arow{position:absolute;left:346px;top:465px;transform:translateY(-50%);display:flex;align-items:center;gap:12px}
  .pill{min-width:92px;height:24px;padding:0 16px;background:#1a1a1a;border-radius:12px;
    display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
  .an{font-size:14px;font-weight:700;color:#1a1a1a;white-space:nowrap}

  .copy{position:absolute;left:40px;top:693px;transform:translateY(-50%);font-size:14px;color:#1a1a1a}
  .num{position:absolute;right:43px;top:693px;transform:translateY(-50%);font-size:13px;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="head">ダミーテ<i>｜</i>ダミーテキス</div>
    <div class="logo">LOGO</div>

    <div class="title">ダミーテキストダ、ミーテキストダ、ミーテキストダミーテキストダミーテキストダミーテキストダミ。<br>（ダミーテキストダミーテキ）</div>

    <div class="box" style="top:234px"></div>
    <div class="div" style="top:234px;height:78px"></div>
    <div class="badge" style="top:273px">STEP 1</div>
    <div class="st" style="top:273px">ダミーテ</div>
    <div class="ds" style="top:273px">ダミーテキストダミーテキストダミーテキストダミーテキス（トダミーテキス）</div>

    <div class="vl" style="top:313px;height:26px"></div>

    <div class="box" style="top:347px"></div>
    <div class="div" style="top:347px;height:78px"></div>
    <div class="badge" style="top:386px">STEP 2</div>
    <div class="st" style="top:386px">ダミ（ーテキ）</div>
    <div class="ds" style="top:386px">ダミーテキストダミーテキストダミーテキストダミーテキストダミーテキストダミー</div>

    <div class="vl" style="top:430px;height:48px"></div>
    <div class="down" style="left:221px;top:483px"></div>

    <div class="hl" style="left:230px;top:465px;width:85px"></div>
    <div class="right" style="left:315px;top:458px"></div>
    <div class="arow">
      <div class="pill">Ddummydumm</div>
      <div class="an">ダミーテキストダミ、ーテキストダミーテキストダミーテキ</div>
    </div>

    <div class="box" style="top:504px"></div>
    <div class="div" style="top:504px;height:78px"></div>
    <div class="badge" style="top:543px">STEP 3</div>
    <div class="st" style="top:543px">ダミーテキス</div>
    <div class="ds" style="top:543px">ダミーテキストダミーテキストダミーテ</div>

    <div class="copy">© 20XX Company.</div>
    <div class="num">(31)</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
