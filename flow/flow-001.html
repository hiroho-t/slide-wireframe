<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flow-001</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#eceff3;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .h1{position:absolute;left:77px;top:46px;transform:translateY(-50%);font-size:16px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .h2{position:absolute;left:77px;top:324px;transform:translateY(-50%);font-size:18px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}

  /* 5つのステップカード */
  .card{position:absolute;top:79px;width:179px;height:184px;background:#fff;border-radius:12px}
  .card > *{position:absolute;left:14px;width:151px;text-align:center}
  .card b{top:55px;font-size:15px;font-weight:700;line-height:24px;color:#1a1a1a}
  .card p{top:97px;font-size:12px;font-weight:400;line-height:17.5px;color:#333}
  .box{position:absolute;left:29px;width:119px;height:33px;border:1px solid #ccc;border-radius:4px;
    display:grid;place-items:center;font-size:11px;color:#1a1a1a}

  /* ステップ間の矢印 */
  .arw{position:absolute;top:168px;transform:translateY(-50%);width:0;height:0;
    border-left:14px solid #b3b3b3;border-top:9px solid transparent;border-bottom:9px solid transparent}

  /* 下部のボード */
  .board{position:absolute;left:77px;top:351px;width:1126px;height:342px;background:#fff;border-radius:12px;
    display:grid;place-items:center;font-size:16px;letter-spacing:.2em;color:#c4c4c4}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="h1">DU(ダミーテキストダミーテキスト)ダミーテキス</div>

    <div class="card" style="left:77px"><b>ダミーテキス</b><p>ダミーテキストダミーテキストダミーテキス、トダミーテキストダミーテキス</p></div>
    <i class="arw" style="left:274px"></i>

    <div class="card" style="left:317px"><b>ダミーテキス</b><p>ダミーテキストダミーテキストダミーテキ、ストダミー、テキストダミーテキストダ</p></div>
    <i class="arw" style="left:514px"></i>

    <div class="card" style="left:557px">
      <b>ダミーテキストダミ</b>
      <div class="box" style="top:91px">ダミーテキストダミ</div>
      <div class="box" style="top:131px">ダミーテ</div>
    </div>
    <i class="arw" style="left:754px"></i>

    <div class="card" style="left:796px"><b>ダミーテキ</b><p>ダミーテキストダミーテキストダミーテキストダミーテキストダミーテ。</p></div>
    <i class="arw" style="left:993px"></i>

    <div class="card" style="left:1036px"><b>ダミーテキストダミーテキ</b><p>ダミーテキストダミーテキストダミーテキス・トダミーテキストダ。</p></div>

    <div class="h2">ダミーテキストダミーテキストダミーテキストダミーテ</div>
    <div class="board">IMAGE</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
