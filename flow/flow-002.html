<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flow-002</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fafafb;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .no{position:absolute;left:41px;top:32px;transform:translateY(-50%);font-size:14px;color:#4d4d4d}
  .h-ja{position:absolute;left:78px;top:32px;transform:translateY(-50%);font-size:17px;font-weight:700;color:#1a1a1a}
  .h-sub{position:absolute;left:242px;top:32px;transform:translateY(-50%);font-size:14px;color:#1a1a1a}

  .lead{position:absolute;left:105px;top:136px;font-size:17px;line-height:26px;color:#1a1a1a}

  /* 4段のシェブロン */
  .band{position:absolute;left:102px;top:213px;width:1084px;height:270px}
  .seg{position:absolute;top:0;width:326px;height:270px;
    clip-path:polygon(0 0,271px 0,326px 135px,271px 270px,0 270px,55px 135px)}
  .seg:first-child{clip-path:polygon(0 0,271px 0,326px 135px,271px 270px,0 270px)}
  .s1{left:0;background:#efefef}
  .s2{left:271px;background:#e2e2e2}
  .s3{left:542px;background:#d2d2d2}
  .s4{left:813px;width:271px;background:#bdbdbd;clip-path:polygon(0 0,271px 0,271px 270px,0 270px,55px 135px)}

  .step{position:absolute;top:252px;transform:translateY(-50%);font-size:34px;font-weight:700;letter-spacing:.02em;color:rgba(255,255,255,.85)}
  .ttl{position:absolute;top:349px;transform:translateY(-50%);width:260px;text-align:center;font-size:28px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .dot{position:absolute;top:349px;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid rgba(255,255,255,.9)}

  /* 下部の補足ブロック */
  .nh{position:absolute;top:526px;transform:translateY(-50%);font-size:14px;font-weight:700;color:#1a1a1a}
  .nb{position:absolute;top:551px;font-size:11px;line-height:21px;color:#333}

  .logo{position:absolute;left:41px;top:692px;transform:translateY(-50%);font-size:18px;font-weight:700;letter-spacing:.06em;color:#1a1a1a}
  .copy{position:absolute;right:28px;top:700px;transform:translateY(-50%);font-size:12px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="no">05</div>
    <div class="h-ja">ダミーテキスト</div>
    <div class="h-sub">ダミーテキ</div>

    <div class="lead">ダミーテキストダミーテキストダミー、テキストダミーテキストダミーテキストダミーテキストダミーテ。<br>ダミ、ーテキストダミーテキストダミーテキストダミーテキストダミー。</div>

    <div class="band">
      <div class="seg s1"></div>
      <div class="seg s2"></div>
      <div class="seg s3"></div>
      <div class="seg s4"></div>
    </div>

    <div class="step" style="left:117px">STEP 1</div>
    <div class="step" style="left:399px">STEP 2</div>
    <div class="step" style="left:674px">STEP 3</div>
    <div class="step" style="left:935px">STEP 4</div>

    <div class="ttl" style="left:116px">ダミーテキスト</div>
    <div class="ttl" style="left:418px">ダミーテ</div>
    <div class="ttl" style="left:682px">ダミ</div>
    <div class="ttl" style="left:929px">ダミーテ</div>

    <i class="dot" style="left:412px"></i>
    <i class="dot" style="left:681px"></i>
    <i class="dot" style="left:940px"></i>

    <div class="nh" style="left:135px">ダミーテキストダミーテ</div>
    <div class="nb" style="left:135px">ダミーテ。キス、トダミーテキストダミーテキストダミ（ーテ）キストダミーテキストダミーテキスト。<br>ダミーテキストダミーテキストダミーテキストダミ、ーテキストダミーテキス。</div>

    <div class="nh" style="left:754px">ダミーテ</div>
    <div class="nb" style="left:754px">ダミ0〜0ーテキストダミーテ。</div>

    <div class="logo">LOGO</div>
    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
