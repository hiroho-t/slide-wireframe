<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flow-006</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .eyebrow{position:absolute;left:71px;top:62px;transform:translateY(-50%);font-size:15px;font-weight:700;letter-spacing:.02em;color:#4d4d4d}
  .title{position:absolute;left:68px;top:106px;transform:translateY(-50%);font-size:34px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .rule{position:absolute;left:71px;top:163px;width:39px;height:5px;background:#8c8c8c}

  .h{position:absolute;top:271px;transform:translateY(-50%);font-size:32px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .h em{font-style:normal;color:#8c8c8c;margin-right:12px}

  .box{position:absolute;top:304px;width:356px;height:219px;background:#f2f2f2;border-radius:12px}
  .li{position:absolute;top:368px;font-size:12px;line-height:28px;color:#1a1a1a}
  .li div{position:relative;padding-left:16px}
  .li div:before{content:"・";position:absolute;left:0}

  .arw{position:absolute;top:410px;transform:translateY(-50%);width:0;height:0;
    border-left:16px solid #c4c4c4;border-top:10px solid transparent;border-bottom:10px solid transparent}

  .sum-arw{position:absolute;left:189px;top:605px;transform:translateY(-50%);width:53px;height:14px;background:#8c8c8c;
    clip-path:polygon(0 4px,36px 4px,36px 0,53px 7px,36px 14px,36px 10px,0 10px)}
  .sum{position:absolute;left:260px;top:605px;transform:translateY(-50%);font-size:26px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="eyebrow">Issues</div>
    <div class="title">ダミーテキストダミ、ーテキストダミーテキストダミー</div>
    <div class="rule"></div>

    <div class="h" style="left:89px"><em>1.</em>ダミーテキ</div>
    <div class="h" style="left:463px"><em>2.</em>ダミーテキ</div>
    <div class="h" style="left:847px"><em>3.</em>ダミー</div>

    <div class="box" style="left:75px"></div>
    <div class="li" style="left:89px">
      <div>ダミーテキストダミーテキスト</div>
      <div>ダミーテキストダミーテキストダミー</div>
      <div>ダミーテキストダミーテキストダミ</div>
    </div>

    <i class="arw" style="left:435px"></i>

    <div class="box" style="left:455px"></div>
    <div class="li" style="left:469px">
      <div>ダミーテキストダミーテキストダ</div>
      <div>ダミーテキストダミーテキストダミー</div>
      <div>ダミーテキストダミーテキストダミー</div>
    </div>

    <i class="arw" style="left:815px"></i>

    <div class="box" style="left:835px"></div>
    <div class="li" style="left:849px">
      <div>ダミーテキストダミーテキスト</div>
      <div>ダミーテキストダミーテキス</div>
      <div>ダミーテキストダミーテキストダ</div>
    </div>

    <i class="sum-arw"></i>
    <div class="sum">ダミーテキ、ストダミーテ、キストダミーテキ、ストダミーテキストダ</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
