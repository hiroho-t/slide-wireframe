<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>member-010</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#f4f5f8;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  .eyebrow{position:absolute;left:67px;top:66px;transform:translateY(-50%);font-size:14px;font-weight:700;color:#1a1a1a}
  .title{position:absolute;left:67px;top:106px;transform:translateY(-50%);font-size:38px;font-weight:700;color:#1a1a1a}

  .p{position:absolute;width:240px;text-align:center}
  .p i{display:grid;place-items:center;width:152px;height:152px;margin:0 auto;border-radius:50%;
    background:#ddd;font-size:11px;font-style:normal;letter-spacing:.16em;color:#8c8c8c}
  .p b{display:block;margin-top:24px;font-size:21px;font-weight:700;color:#1a1a1a}
  .p span{display:block;margin-top:10px;font-size:12px;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="eyebrow">ダミーテキスト</div>
    <div class="title">ダミー</div>

    <div class="p" style="left:170px;top:164px"><i>IMAGE</i><b>ダミ ーテキ</b><span>ダミーテキ DUM</span></div>
    <div class="p" style="left:403px;top:164px"><i>IMAGE</i><b>ダミ ーテ</b><span>ダミー DUM</span></div>
    <div class="p" style="left:640px;top:164px"><i>IMAGE</i><b>ダミ ーテ</b><span>ダミー DUM</span></div>
    <div class="p" style="left:870px;top:164px"><i>IMAGE</i><b>ダミ ーテ</b><span>ダミーテキストダミーテ</span></div>

    <div class="p" style="left:284px;top:407px"><i>IMAGE</i><b>ダミ ーテキ</b><span>ダミーテキス</span></div>
    <div class="p" style="left:516px;top:407px"><i>IMAGE</i><b>ダミ ーテキ</b><span>ダミ DU</span></div>
    <div class="p" style="left:749px;top:407px"><i>LOGO</i><b>DUMMYD&amp;Um.</b><span>ダミーテ</span></div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
