<!DOCTYPE html>

<title>company-022</title>
<style>

  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);font-feature-settings:"palt" 1}

  .pill{position:absolute;left:120px;top:172px;width:134px;height:24px;border:1px solid #6b6b6b;border-radius:12px;
    display:grid;place-items:center;font-size:11px;letter-spacing:.24em;color:#6b6b6b}
  .mis{position:absolute;left:125px;font-size:46px;letter-spacing:.06em;color:#4d4d4d;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;transform:translateY(-50%)}

  .lb{position:absolute;width:105px;left:791px;text-align:right;transform:translateY(-50%);
    font-size:11px;font-weight:500;letter-spacing:.04em;color:#4d4d4d;white-space:nowrap}
  .vl{position:absolute;left:911px;transform:translateY(-50%);font-size:14px;letter-spacing:.02em;color:#1a1a1a;white-space:nowrap}
  .vl small{font-size:10px}
  .ru{position:absolute;left:791px;width:105px;height:1px;background:#c4c4c4}

  .dot{position:absolute;left:786px;top:543px;width:366px;height:1px;
    background:repeating-linear-gradient(to right,#c4c4c4 0 3px,transparent 3px 7px)}
  .lg{position:absolute;height:35px;background:#e0e0e0;display:grid;place-items:center;

</head>

</html>
