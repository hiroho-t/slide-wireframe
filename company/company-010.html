<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>company-010</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#ededed;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .side{position:absolute;left:0;top:0;width:46px;height:720px;background:#2b2b2b}
  .side-no{position:absolute;left:18px;top:25px;transform:translateY(-50%);font-size:20px;font-weight:700;color:#fff}
  .side-rule{position:absolute;left:7px;top:39px;width:24px;height:1px;background:#fff}
  .side-ja{position:absolute;left:23px;top:57px;transform:translateX(-50%);writing-mode:vertical-rl;font-size:14px;letter-spacing:.3em;color:#fff}
  .side-logo{position:absolute;left:23px;top:608px;transform:translateX(-50%);writing-mode:vertical-rl;font-size:16px;font-weight:700;letter-spacing:.12em;color:#fff}

  .title{position:absolute;left:87px;top:63px;transform:translateY(-50%);font-size:28px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}

  .logo{position:absolute;left:142px;width:306px;top:348px;transform:translateY(-50%);text-align:center;font-size:48px;font-weight:700;letter-spacing:.04em;color:#1a1a1a}
  .logo-sub{position:absolute;left:142px;width:306px;top:405px;transform:translateY(-50%);text-align:center;font-size:24px;font-weight:700;letter-spacing:.12em;color:#1a1a1a}

  .lb{position:absolute;left:544px;transform:translateY(-50%);font-size:14px;color:#1a1a1a}
  .vl{position:absolute;left:715px;transform:translateY(-50%);font-size:14px;line-height:27px;color:#1a1a1a}

  .copy{position:absolute;right:21px;top:704px;transform:translateY(-50%);font-size:11px;letter-spacing:.04em;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="side"></div>
    <div class="side-no">1</div>
    <div class="side-rule"></div>
    <div class="side-ja">ダミーテ</div>
    <div class="side-logo">LOGO</div>

    <div class="title">ダミーテ</div>

    <div class="logo">LOGO</div>
    <div class="logo-sub">ダミーテキ</div>

    <div class="lb" style="top:178px">ダミ</div>
    <div class="vl" style="top:178px">ダミーテdummyd（キストダミ）</div>

    <div class="lb" style="top:252px">ダミ</div>
    <div class="vl" style="top:252px">0000ダ0ミ0ー</div>

    <div class="lb" style="top:329px">ダミー</div>
    <div class="vl" style="top:329px">ダミ ーテ</div>

    <div class="lb" style="top:405px">ダミー</div>
    <div class="vl" style="top:419px">ダミーテ：キストダミーテキ0-00–0<br>ダミーテ：キストダミーテキストダミ0−00</div>

    <div class="lb" style="top:509px">ダミー</div>
    <div class="vl" style="top:509px">0ダ （+ミーテキ0ス）</div>

    <div class="lb" style="top:585px">ダミーテ</div>
    <div class="vl" style="top:599px">ダミーテキストダミーテキス、トダDUミーテキ、ストダミ、<br>ダミーテキスト</div>

    <div class="copy">© 20XX Company.</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
