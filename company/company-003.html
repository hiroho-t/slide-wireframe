<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>company-003</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}


  .card{position:absolute;left:30px;top:20px;width:1221px;height:680px;background:#fff;border-radius:20px}


  .h1{position:absolute;left:0;width:1280px;top:83px;transform:translateY(-50%);text-align:center;font-size:30px;font-weight:700;color:#2b2b2b}
  .h2{position:absolute;left:0;width:1280px;top:140px;transform:translateY(-50%);text-align:center;font-size:30px;font-weight:700;color:#2b2b2b}
  .h2 sup{font-size:12px;vertical-align:super}

  .divt{position:absolute;left:0;width:1280px;top:347px;transform:translateY(-50%);text-align:center;font-size:16px;font-weight:700;color:#2b2b2b}
  .divl{position:absolute;top:347px;height:1px;background:#2b2b2b}

  .sq{position:absolute;width:13px;height:13px;transform:translateY(-50%);background:#4d4d4d}
  .lb{position:absolute;transform:translateY(-50%);font-size:15px;font-weight:700;color:#2b2b2b}
  .vl{position:absolute;transform:translateY(-50%);font-size:16px;font-weight:700;color:#2b2b2b}


  .page{position:absolute;right:19px;top:700px;transform:translateY(-50%);font-size:10px;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="card"></div>


    <div class="h1">ダミーテキストが入る見出しのダミーテキストです、</div>
    <div class="h2">ダミー見出No.0<sup>※</sup>の名称</div>

    <div class="divt">項目名称</div>
    <div class="divl" style="left:100px;width:470px"></div>
    <div class="divl" style="left:710px;width:471px"></div>

    <div class="sq" style="left:175px;top:405px"></div>
    <div class="lb" style="left:199px;top:405px">項目名</div>
    <div class="vl" style="left:277px;top:405px">ダミーテキスト名称(ダミー dummy, inc.)</div>

    <div class="sq" style="left:175px;top:442px"></div>
    <div class="lb" style="left:199px;top:442px">項目名</div>
    <div class="vl" style="left:277px;top:442px">ダミー：ダミーテキス0-00-00</div>
    <div class="vl" style="left:277px;top:478px">ダミーテキストダミーテキ 00F</div>
    <div class="vl" style="left:277px;top:514px">（※ダミー、ダミー、ダミにダミーテキ）</div>

    <div class="sq" style="left:674px;top:405px"></div>
    <div class="lb" style="left:698px;top:405px">項目の名称</div>
    <div class="vl" style="left:817px;top:405px">20XX年X月XX日</div>

    <div class="sq" style="left:674px;top:442px"></div>
    <div class="lb" style="left:698px;top:442px">ダミー項目</div>
    <div class="vl" style="left:817px;top:442px">20XX年X月XX日</div>

    <div class="page">6</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
