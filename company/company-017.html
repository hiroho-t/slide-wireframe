<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>company-017</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .head{position:absolute;left:39px;top:39px;transform:translateY(-50%);font-size:15px;font-weight:700;color:#1a1a1a}
  .logo{position:absolute;right:42px;top:39px;transform:translateY(-50%);font-size:18px;font-weight:700;letter-spacing:.04em;color:#1a1a1a}

  .lb{position:absolute;left:72px;transform:translateY(-50%);font-size:15px;color:#1a1a1a}
  .vl{position:absolute;left:308px;transform:translateY(-50%);font-size:15px;font-weight:700;color:#1a1a1a}

  .ph{position:absolute;left:674px;top:158px;width:536px;height:409px;background:#dcdcdc;border-radius:10px;
    display:grid;place-items:center;font-size:16px;letter-spacing:.2em;color:#8c8c8c}

  .copy{position:absolute;left:39px;top:690px;transform:translateY(-50%);font-size:14px;color:#1a1a1a}
  .num{position:absolute;right:43px;top:690px;transform:translateY(-50%);font-size:14px;color:#1a1a1a}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="head">ダミーテ</div>

    <div class="lb" style="top:206px">ダミー</div>
    <div class="vl" style="top:206px">Ddummydumダミーテ</div>

    <div class="lb" style="top:258px">ダミ</div>
    <div class="vl" style="top:258px">0000ダ0ミ0ー</div>

    <div class="lb" style="top:311px">ダミーテキ/ストダ</div>
    <div class="vl" style="top:311px">ダミーテキ スト</div>

    <div class="lb" style="top:363px">ダミーテキスト/ダミー</div>
    <div class="vl" style="top:363px">ダミ ーテ</div>

    <div class="lb" style="top:416px">ダミーテキスト/ダミー</div>
    <div class="vl" style="top:416px">ダミ ーテ</div>

    <div class="lb" style="top:468px">ダミーテキ</div>

    <div class="ph">IMAGE</div>

    <div class="copy">© 20XX Company.</div>
    <div class="num">(04)</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
