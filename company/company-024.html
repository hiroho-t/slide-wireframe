<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>company-024</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);font-feature-settings:"palt" 1}

  .en{position:absolute;left:75px;top:60px;transform:translateY(-50%);font-size:27px;font-weight:700;letter-spacing:.1em;color:#1a1a1a}
  .jp{position:absolute;right:57px;top:60px;transform:translateY(-50%);font-size:14px;font-weight:700;letter-spacing:.06em;color:#1a1a1a}

  .photo{position:absolute;left:445px;top:95px;width:785px;height:553px;background:#c4c4c4}
  .photo span{position:absolute;right:24px;bottom:18px;font-size:15px;letter-spacing:.2em;color:#e6e6e6}
  .plogo{position:absolute;left:787px;top:353px;transform:translateY(-50%);font-size:40px;font-weight:700;letter-spacing:.06em;color:#fff}
  .panel{position:absolute;left:147px;top:167px;width:526px;height:450px;background:#fff}

  .lb{position:absolute;left:155px;transform:translateY(-50%);font-size:13px;letter-spacing:.1em;color:#4d4d4d;white-space:nowrap}
  .vl{position:absolute;left:298px;transform:translateY(-50%);font-size:20px;font-weight:700;letter-spacing:.02em;color:#1a1a1a;white-space:nowrap}
  .vl small{font-size:11px;font-weight:400}

  .bd{position:absolute;left:148px;top:530px;width:1px;height:67px;background:#c4c4c4}
  .bg{position:absolute;height:60px;background:#ededed;display:grid;place-items:center;
    font-size:10px;letter-spacing:.16em;color:#8c8c8c}

  .fr{position:absolute;right:55px;top:701px;transform:translateY(-50%);font-size:10px;letter-spacing:.08em;color:#4d4d4d}
  .pn{position:absolute;right:20px;top:701px;transform:translateY(-50%);font-size:11px;font-weight:700;color:#4d4d4d}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="en">COMPANY PROFILE</div>
    <div class="jp">ダミーテキ</div>

    <div class="photo"><span>IMAGE</span></div>
    <div class="plogo">LOGO</div>
    <div class="panel"></div>

    <div class="lb" style="top:203px">ダミーテ</div>
    <div class="vl" style="top:203px">ダミーテキストダミーテキストダミ</div>

    <div class="lb" style="top:267px">ダミ</div>
    <div class="vl" style="top:267px">20XX年X月XX日</div>

    <div class="lb" style="top:335px">ダミー</div>
    <div class="vl" style="top:335px">000百万円<small>（ダミーテキストダ）※20XX年XX月末時点</small></div>

    <div class="lb" style="top:401px">ダミーテ</div>
    <div class="vl" style="top:401px">00人<small>（ダミーテキストダミ）※20XX年XX月末時点</small></div>

    <div class="lb" style="top:479px">ダミ</div>
    <div class="vl" style="top:466px">ダミーテキストダミーテキス00番00号</div>
    <div class="vl" style="top:492px">ダミーテキストダミーテキ</div>

    <div class="bd"></div>
    <div class="bg" style="left:152px;width:195px;top:533px">LOGO</div>
    <div class="bg" style="left:363px;width:77px;top:533px">LOGO</div>
    <div class="bg" style="left:467px;width:97px;top:533px">LOGO</div>

    <div class="fr">© 20XX Company.</div>
    <div class="pn">00</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
