<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>company-013</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18)}

  .brand{position:absolute;left:35px;top:26px;transform:translateY(-50%);font-size:12px;font-weight:700;letter-spacing:.04em;color:#4d4d4d}
  .dot{position:absolute;left:128px;top:26px;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:#b3b3b3}
  .deck{position:absolute;left:145px;top:26px;transform:translateY(-50%);font-size:12px;letter-spacing:.04em;color:#8c8c8c}

  .title{position:absolute;left:107px;top:106px;transform:translateY(-50%);font-size:28px;font-weight:700;letter-spacing:.02em;color:#1a1a1a}
  .logo{position:absolute;left:110px;top:200px;transform:translateY(-50%);font-size:48px;font-weight:700;letter-spacing:.04em;color:#1a1a1a}

  .sep{position:absolute;left:578px;width:592px;height:1px;background:#e6e6e6}
  .lb{position:absolute;left:578px;transform:translateY(-50%);font-size:12px;color:#8c8c8c}
  .vl{position:absolute;left:578px;font-size:17px;line-height:26px;color:#1a1a1a}

  .page{position:absolute;right:29px;top:705px;transform:translateY(-50%);font-size:11px;letter-spacing:.2em;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="brand">LOGO</div>
    <i class="dot"></i>
    <div class="deck">Ddummyd Uumm</div>

    <div class="title">ダミーテ</div>
    <div class="logo">LOGO</div>

    <div class="sep" style="top:158px"></div>
    <div class="lb" style="top:179px">ダミー</div>
    <div class="vl" style="top:194px">ダミーテキストダミーテキス</div>

    <div class="sep" style="top:236px"></div>
    <div class="lb" style="top:256px">ダミー</div>
    <div class="vl" style="top:271px">ダ000-0000 ミーテキストダミ0-0-0 ーテキストダミーテキ 00D</div>

    <div class="sep" style="top:314px"></div>
    <div class="lb" style="top:334px">ダミ</div>
    <div class="vl" style="top:347px">0000ダ0ミ0ー</div>

    <div class="sep" style="top:391px"></div>
    <div class="lb" style="top:411px">ダミ</div>
    <div class="vl" style="top:425px">ダミーテキDUM スト ダミ</div>

    <div class="sep" style="top:468px"></div>
    <div class="lb" style="top:488px">ダミー</div>
    <div class="vl" style="top:502px">00,000,000ダ</div>

    <div class="sep" style="top:546px"></div>
    <div class="lb" style="top:566px">ダミーテ</div>
    <div class="vl" style="top:580px">0. ダミーテキストダミーテキストダミーテキスト<br>0. ダミーテキス・トダミーテキ</div>
    <div class="sep" style="top:645px"></div>

    <div class="page">・3</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
