<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>company-004</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  /* 右：全高の写真 */
  .photo{position:absolute;left:710px;top:0;width:570px;height:720px;background:#d0d0d0;display:grid;place-items:center;font-size:16px;letter-spacing:.2em;color:#8c8c8c}

  .title{position:absolute;left:27px;top:41px;transform:translateY(-50%);font-size:22px;font-weight:700;color:#1a1a1a}

  .lb{position:absolute;left:105px;transform:translateY(-50%);font-size:17px;font-weight:700;color:#1a1a1a}
  .vl{position:absolute;left:196px;transform:translateY(-50%);font-size:17px;color:#1a1a1a}
  .vs{font-size:11px}
  .sub{position:absolute;left:196px;transform:translateY(-50%);font-size:11px;font-weight:700;color:#1a1a1a}

  .copy{position:absolute;left:25px;top:691px;transform:translateY(-50%);font-size:11px;color:#8c8c8c}
  .page{position:absolute;right:11px;top:704px;transform:translateY(-50%);font-size:10px;color:rgba(255,255,255,.85)}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="photo">IMAGE</div>
    <div class="title">項目名称</div>

    <div class="lb" style="top:142px">項目名</div>
    <div class="vl" style="top:142px">ダミーテキスト名</div>

    <div class="lb" style="top:190px">項目</div>
    <div class="vl" style="top:190px">20XX年X月XX日</div>

    <div class="lb" style="top:239px">名称</div>
    <div class="vl" style="top:239px">ダミー 名</div>

    <div class="lb" style="top:287px">項目名称</div>
    <div class="vl" style="top:287px">000名 <span class="vs">（0000ダ0ミーテ キスト・ダミーテキ・ストダミーテキ）</span></div>

    <div class="lb" style="top:331px">項目名</div>
    <div class="sub" style="top:331px">ダミー名</div>
    <div class="vl" style="top:353px">〒000-0000</div>
    <div class="vl" style="top:380px">ダミーテキスト0-00-00 ダミーテキスト0ダミ 0ー</div>

    <div class="sub" style="top:411px">ダミー名</div>
    <div class="vl" style="top:432px">〒000-0000</div>
    <div class="vl" style="top:459px">ダミーテキストダミー0-0-00 DUMM0 Y0テキ 0ス</div>

    <div class="sub" style="top:489px">ダミー名</div>
    <div class="vl" style="top:511px">〒000-0000</div>
    <div class="vl" style="top:538px">ダミーテキストダミーテキ0-0-0 ストダミー 0テ</div>

    <div class="lb" style="top:585px">項目名</div>
    <div class="vl" style="top:585px">DUM/MYD 00000:0000 &amp; UMM Y 00000:0000</div>

    <div class="copy">© 20XX Company.</div>
    <div class="page">39</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
