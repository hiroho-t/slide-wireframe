<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>company-014</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#f4f5f8;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  .eyebrow{position:absolute;left:68px;top:67px;transform:translateY(-50%);font-size:14px;font-weight:700;color:#1a1a1a}
  .title{position:absolute;left:65px;top:109px;transform:translateY(-50%);font-size:40px;font-weight:700;color:#1a1a1a}

  .lb{position:absolute;left:117px;transform:translateY(-50%);font-size:15px;font-weight:700;color:#1a1a1a}
  .vl{position:absolute;left:254px;transform:translateY(-50%);font-size:15px;line-height:36px;color:#1a1a1a}


  .ph{position:absolute;background:#d0d0d0;display:grid;place-items:center;font-size:14px;letter-spacing:.2em;color:#8c8c8c}
  .ph1{left:918px;top:-24px;width:348px;height:375px;border-radius:0 0 20px 20px}
  .ph2{left:843px;top:380px;width:437px;height:275px;border-radius:20px}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="eyebrow">ダミーテキスト</div>
    <div class="title">ダミーテ</div>

    <div class="lb" style="top:204px">ダミ</div>
    <div class="vl" style="top:204px">ダミーテキストダ</div>

    <div class="lb" style="top:246px">ダミー</div>
    <div class="vl" style="top:246px">ダミ ーテキ</div>

    <div class="lb" style="top:289px">ダミ</div>
    <div class="vl" style="top:289px">0000ダ0ミ0ー</div>

    <div class="lb" style="top:332px">ダミー</div>
    <div class="vl" style="top:332px">ダミーテキストダミ0-00</div>

    <div class="lb" style="top:374px">ダミー</div>
    <div class="vl" style="top:374px">000,000,000ダ</div>

    <div class="lb" style="top:417px">ダミーテ</div>
    <div class="vl" style="top:435px">ダミーテキス、トダミーテキストダミーテキスト<br>ダミーテキスト・ダミ・ーテ</div>


    <div class="ph ph1">IMAGE</div>
    <div class="ph ph2">IMAGE</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
