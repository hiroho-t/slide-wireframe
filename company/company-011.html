<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>company-011</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  .eyebrow{position:absolute;left:74px;top:65px;transform:translateY(-50%);font-size:15px;font-weight:700;color:#4d4d4d}
  .title{position:absolute;left:71px;top:108px;transform:translateY(-50%);font-size:34px;font-weight:700;color:#1a1a1a}
  .rule{position:absolute;left:74px;top:166px;width:36px;height:5px;background:#b3b3b3}

  .lb{position:absolute;left:74px;transform:translateY(-50%);font-size:13px;font-weight:700;color:#1a1a1a}
  .vl{position:absolute;left:200px;transform:translateY(-50%);font-size:13px;font-weight:700;color:#1a1a1a}
  .vl small{font-size:11px;font-weight:400;margin-left:10px}

  .photo{position:absolute;left:654px;top:0;width:626px;height:720px;background:#d0d0d0;
    display:grid;place-items:center;font-size:16px;letter-spacing:.2em;color:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="eyebrow">About Us</div>
    <div class="title">ダミーテ</div>
    <div class="rule"></div>

    <div class="lb" style="top:327px">ダミ</div>
    <div class="vl" style="top:327px">ダミーテキストダミー</div>

    <div class="lb" style="top:371px">ダミー</div>
    <div class="vl" style="top:371px">ダミ ーテ</div>

    <div class="lb" style="top:417px">ダミ</div>
    <div class="vl" style="top:417px">0000ダ0ミ0ー</div>

    <div class="lb" style="top:462px">ダミー</div>
    <div class="vl" style="top:462px">000ダ（ミー・テキス）</div>

    <div class="lb" style="top:508px">ダミーテ</div>
    <div class="vl" style="top:508px">ダミーテキストダミーテ0000キ</div>

    <div class="lb" style="top:556px">ダミー</div>
    <div class="vl" style="top:556px">00.0ダミ <small>(ーテキストダミー）</small></div>

    <div class="photo">IMAGE</div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
