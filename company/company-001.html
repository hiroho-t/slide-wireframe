<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>company-001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200..800&family=Poppins:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#e9e9e9;font-family:"Poppins","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;overflow:hidden}
  .slide{position:relative;width:1280px;height:720px;background:#fff;overflow:hidden;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;box-shadow:0 4px 24px rgba(0,0,0,.18);letter-spacing:.8px}

  /* ヘッダー */
  .head{position:absolute;left:30px;top:32px;transform:translateY(-50%);display:flex;align-items:center;gap:17px}
  .h-en{font-size:22px;font-weight:700;color:#4d4d4d}
  .h-bar{width:1px;height:23px;background:#c4c4c4}
  .h-ja{margin-left:9px;font-size:19px;font-weight:700;color:#4d4d4d}
  .logo{position:absolute;right:32px;top:30px;transform:translateY(-50%);font-size:26px;font-weight:700;color:#1a1a1a}

  /* 概要テーブル */
  .lb{position:absolute;left:68px;transform:translateY(-50%);font-size:14px;color:#666}
  .vl{position:absolute;left:210px;transform:translateY(-50%);font-size:15px;color:#1a1a1a}
  .ln{position:absolute;left:68px;width:718px;height:1px;background:#e0e0e0}

  /* 右：写真 */
  .ph{position:absolute;background:#d0d0d0;border-radius:8px;display:grid;place-items:center;font-size:13px;letter-spacing:.2em;color:#8c8c8c}

  .copy{position:absolute;left:32px;top:693px;transform:translateY(-50%);font-size:11px;color:#666}
  .page{position:absolute;right:29px;top:693px;transform:translateY(-50%);font-size:11px;color:#666}
  .bar{position:absolute;left:0;top:715px;width:32px;height:5px;background:#8c8c8c}
</style>
</head>
<body>
<div class="stage">
  <div class="slide">
    <div class="head"><span class="h-en">Dummy 01</span><i class="h-bar"></i><span class="h-ja">項目名称</span></div>
    <div class="logo">LOGO</div>

    <div class="lb" style="top:159px">項目名</div>
    <div class="vl" style="top:159px">ダミーダミー株式会社（dummy inc.）</div>
    <div class="ln" style="top:184px"></div>

    <div class="lb" style="top:210px">項目の名称</div>
    <div class="vl" style="top:210px">〒000-0000 ダミーダミーダミーダミー0-00-00 ダミーダミービル 0F</div>
    <div class="ln" style="top:235px"></div>

    <div class="lb" style="top:262px">項目</div>
    <div class="vl" style="top:262px">20XX年XX月XX日</div>
    <div class="ln" style="top:287px"></div>

    <div class="lb" style="top:312px">ダミー項目</div>
    <div class="vl" style="top:312px">ダミー 名</div>
    <div class="ln" style="top:338px"></div>

    <div class="lb" style="top:363px">項目名</div>
    <div class="vl" style="top:363px">ダミー 名</div>
    <div class="ln" style="top:389px"></div>

    <div class="lb" style="top:415px">項目名称</div>
    <div class="vl" style="top:415px">ダミー 名</div>
    <div class="ln" style="top:440px"></div>

    <div class="lb" style="top:466px">項目名</div>
    <div class="vl" style="top:466px">0,000万円</div>
    <div class="ln" style="top:491px"></div>

    <div class="lb" style="top:517px">項目名称</div>
    <div class="vl" style="top:517px">000人（ダミー社員000人）</div>
    <div class="ln" style="top:543px"></div>

    <div class="lb" style="top:568px">項目名称</div>
    <div class="vl" style="top:568px">ダミーAB銀行　ダミーダミーテキスト銀行</div>

    <div class="ph" style="left:853px;top:63px;width:132px;height:129px">IMAGE</div>
    <div class="ph" style="left:985px;top:224px;width:266px;height:153px">IMAGE</div>
    <div class="ph" style="left:889px;top:441px;width:220px;height:224px">IMAGE</div>

    <div class="copy">© Dummy0 Inc. 20XX</div>
    <div class="page">04</div>
    <div class="bar"></div>
  </div>
</div>
<script>
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerWidth/1280,innerHeight/720));
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
